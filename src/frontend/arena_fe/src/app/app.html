<main class="arena-shell" [class.arena-shell--tight]="state().heroTheme === 'corewar'">
  <fe-header></fe-header>
  <arena-entrypoint-shell></arena-entrypoint-shell>
  @if (state().heroTheme !== 'corewar') {
    <footer class="arena-footer">
      <button type="button" class="arena-footer-link" title="Team" (click)="openTeam()">
        <img src="affiliations/mit.svg" alt="MIT" class="arena-footer-logo" />
      </button>
      <button type="button" class="arena-footer-link" title="Team" (click)="openTeam()">
        <img src="affiliations/ucsf.svg" alt="UCSF" class="arena-footer-logo" />
      </button>
      <span class="arena-version">{{ version }}</span>
    </footer>
  }
</main>
