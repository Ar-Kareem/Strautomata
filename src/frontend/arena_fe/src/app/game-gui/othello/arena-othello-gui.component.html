<div class="othello-gui">
  <arena-banner [message]="matchBannerMessage"></arena-banner>
  <arena-gui-alert [message]="statusTone === 'error' ? statusMessage : null"></arena-gui-alert>
  <div class="othello-head">
    <div>
      @if (currentPlayer === 0 || currentPlayer === 1) {
        <p>Player: {{ activePlayerLabel }}</p>
      }
    </div>
    <div class="othello-stats">
      <div class="stone-count">White {{ whiteCount }} · Black {{ blackCount }}</div>
    </div>
  </div>
  <arena-human-move-panel
    [show]="showHumanControls"
    [hint]="humanHint"
    [errorMessage]="illegalClickMessage"
    [errorToken]="illegalClickToken"
  ></arena-human-move-panel>
  @if (boardSize > 0) {
    <div
      class="othello-board"
      [style.--size]="boardSize"
      [class.is-interactive]="awaitingHumanMove"
      [class.has-winner]="hasWinner"
    >
      @for (cell of cells; track cell.key) {
        <div
          class="othello-cell"
          [class.is-dark]="cell.isDark"
          [class.is-legal]="cell.legal"
          [class.is-illegal]="cell.illegal"
          [class.is-winning]="cell.winning"
          [attr.data-owner]="cell.owner ?? null"
          (click)="onCellClick(cell)"
        >
          <span class="othello-disc" aria-hidden="true"></span>
        </div>
      }
    </div>
  } @else {
    <arena-gui-empty></arena-gui-empty>
  }
  <arena-gui-legend>
    <span class="legend-item">
      <span class="legend-dot accent-inverse" aria-hidden="true"></span>
      {{ botB }}
    </span>
    <span class="legend-item">
      <span class="legend-dot accent" aria-hidden="true"></span>
      {{ botA }}
    </span>
  </arena-gui-legend>
</div>
