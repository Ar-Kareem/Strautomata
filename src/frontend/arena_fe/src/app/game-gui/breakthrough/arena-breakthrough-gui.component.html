<div class="breakthrough-gui">
  <div class="arena-gui-overlays">
    <arena-banner [message]="matchBannerMessage"></arena-banner>
    <arena-gui-alert [message]="statusTone === 'error' ? statusMessage : null"></arena-gui-alert>
  </div>
  <div class="breakthrough-head">
    <div>
      @if (currentPlayer === 0 || currentPlayer === 1) {
        <p>Player: {{ activePlayerLabel }}</p>
      }
    </div>
    <div class="breakthrough-stats">
      <div>Green {{ blackCount }} · White {{ whiteCount }}</div>
    </div>
  </div>
  @if (boardSize > 0) {
    <div
      class="breakthrough-board"
      [style.--size]="boardSize"
      [class.is-interactive]="awaitingHumanMove"
      [class.has-winner]="hasWinningLine"
    >
      @for (cell of cells; track cell.key) {
        <div
          class="breakthrough-cell"
          [attr.data-owner]="cell.owner"
          [class.is-selected]="selectedFromKey === cell.coordKey"
          [class.is-legal-from]="cell.legalFrom"
          [class.is-legal-to]="cell.legalTo"
          [class.is-winning]="cell.winning"
          [attr.data-kbd]="kbdLabel(cell)"
          [attr.data-kbd-back]="selectedFromKey === cell.coordKey ? '' : null"
          (click)="onCellClick(cell)"
        >
        <span class="stone" aria-hidden="true">
            <!-- FROM https://uxwing.com/chess-pawn-icon/ -->
            <svg
              class="pawn"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 104.38 122.88"
              aria-hidden="true"
            >
              <path
                d="M35.73,32.57a20.45,20.45,0,1,1,32.91,0Zm35.06,3.88a7.1,7.1,0,0,1,6.17,7h0a7.11,7.11,0,0,1-6.61,7.06H34a7.1,7.1,0,0,1-6.6-7.06h0a7.1,7.1,0,0,1,6.17-7ZM63.33,54.4c.91,14.57,6,26.07,18.75,31.85V91.6H22.3V86.25c12-3.8,17.68-15,18.73-31.85ZM82.39,95.45a14.39,14.39,0,0,1,12.67,14.23v.22H9.32v-.22A14.39,14.39,0,0,1,22,95.45l.31,0H82.08l.31,0ZM94.9,113.77a12,12,0,0,1,9.48,9.11H0a12,12,0,0,1,9.47-9.11Z"
                fill-rule="evenodd"
              ></path>
            </svg>
          </span>
          @if (cell.illegal) {
            <span class="illegal-stone" aria-hidden="true"></span>
          }
        </div>
      }
    </div>
  } @else {
    <arena-gui-empty></arena-gui-empty>
  }
  <arena-gui-legend>
    <span class="legend-item">
      <span class="legend-dot bt-dot-black" aria-hidden="true"></span>
      {{ displaybotA }}
    </span>
    <span class="legend-item">
      <span class="legend-dot bt-dot-white" aria-hidden="true"></span>
      {{ displaybotB }}
    </span>
  </arena-gui-legend>
</div>
