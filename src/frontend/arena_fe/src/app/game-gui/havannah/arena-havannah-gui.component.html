<div class="havannah-gui">
  <div class="arena-gui-overlays">
    <arena-banner [message]="matchBannerMessage"></arena-banner>
    <arena-gui-alert [message]="statusTone === 'error' ? statusMessage : null"></arena-gui-alert>
  </div>
  <div class="havannah-head">
    <div>
      @if (currentPlayer === 0 || currentPlayer === 1) {
        <p>Player: {{ currentPlayer === 0 ? 'Black' : 'White' }}</p>
      }
    </div>
  </div>
  @if (boardSpan > 0) {
    <div
      class="havannah-board-shell"
      [class.show-scroll-left]="showScrollLeft"
      [class.show-scroll-right]="showScrollRight"
    >
      <div
        #boardScroller
        class="havannah-board"
        [style.--cell-size.px]="cellSize"
        [class.is-interactive]="awaitingHumanMove"
        [class.has-winner]="hasWinner"
        (scroll)="onBoardScroll(boardScroller)"
      >
        @for (row of rows; track row.key) {
          <div class="havannah-row" [style.--indent]="row.indent">
            @for (cell of row.cells; track cell.key) {
              @if (cell.playable) {
                <button
                  class="havannah-cell"
                  type="button"
                  [attr.data-owner]="cell.owner ?? null"
                  [class.is-legal]="cell.legal"
                  [class.is-illegal]="cell.illegal"
                  [class.is-winning]="cell.winning"
                  [attr.aria-label]="cell.notation"
                  (click)="onCellClick(cell)"
                >
                  <span class="havannah-piece" aria-hidden="true"></span>
                </button>
              } @else {
                <span class="havannah-gap" aria-hidden="true"></span>
              }
            }
          </div>
        }
      </div>
      <button type="button" class="havannah-scroll-hint havannah-scroll-hint-left" tabindex="-1" aria-label="Scroll board left" (click)="scrollBoard(boardScroller, -1)"></button>
      <button type="button" class="havannah-scroll-hint havannah-scroll-hint-right" tabindex="-1" aria-label="Scroll board right" (click)="scrollBoard(boardScroller, 1)"></button>
    </div>
  } @else {
    <arena-gui-empty></arena-gui-empty>
  }
  <arena-gui-legend>
    <span class="legend-item">
      <span class="legend-dot accent-inverse" aria-hidden="true"></span>
      {{ botB }}
    </span>
    <span class="legend-item">
      <span class="legend-dot accent" aria-hidden="true"></span>
      {{ botA }}
    </span>
  </arena-gui-legend>
</div>
