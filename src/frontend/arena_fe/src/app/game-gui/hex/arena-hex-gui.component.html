<div class="hex-gui">
  <arena-banner [message]="matchBannerMessage"></arena-banner>
  <arena-gui-alert [message]="statusTone === 'error' ? statusMessage : null"></arena-gui-alert>
  <div class="hex-head">
    <div>
      @if (currentPlayer === 0 || currentPlayer === 1) {
        <p>Player: {{ activePlayerLabel }}</p>
      }
    </div>
  </div>
  <arena-human-move-panel
    [show]="showHumanControls"
    [hint]="humanHint"
    [errorMessage]="illegalClickMessage"
    [errorToken]="illegalClickToken"
  ></arena-human-move-panel>
  @if (boardSize > 0) {
    <div
      class="hex-board-shell"
      [class.show-scroll-left]="showScrollLeft"
      [class.show-scroll-right]="showScrollRight"
    >
      <div class="hex-edge hex-edge-top" aria-hidden="true"></div>
      <div class="hex-edge hex-edge-bottom" aria-hidden="true"></div>
      <div class="hex-edge hex-edge-left" aria-hidden="true"></div>
      <div class="hex-edge hex-edge-right" aria-hidden="true"></div>
      <div
        #boardScroller
        class="hex-board"
        [style.--size]="boardSize"
        [style.--cell-size.px]="cellSize"
        [class.is-interactive]="awaitingHumanMove"
        (scroll)="onBoardScroll(boardScroller)"
      >
          @for (row of rows; track row.key) {
            <div class="hex-row" [style.--offset]="row.rowIndex">
              @for (cell of row.cells; track cell.key) {
                <div
                  class="hex-cell"
                  [attr.data-owner]="cell.owner"
                  [class.is-legal]="cell.legal"
                  [class.is-illegal]="cell.illegal"
                  (click)="onCellClick(cell)"
                >
                  <span class="hex-stone" aria-hidden="true"></span>
                </div>
              }
            </div>
          }
      </div>
      <button type="button" class="hex-scroll-hint hex-scroll-hint-left" tabindex="-1" aria-label="Scroll board left" (click)="scrollBoard(boardScroller, -1)"></button>
      <button type="button" class="hex-scroll-hint hex-scroll-hint-right" tabindex="-1" aria-label="Scroll board right" (click)="scrollBoard(boardScroller, 1)"></button>
    </div>
  } @else {
    <arena-gui-empty></arena-gui-empty>
  }
  <arena-gui-legend>
    <span class="legend-item">
      <span class="legend-dot is-cyan" aria-hidden="true"></span>
      {{ botB }}
    </span>
    <span class="legend-item">
      <span class="legend-dot is-orange" aria-hidden="true"></span>
      {{ botA }}
    </span>
  </arena-gui-legend>
</div>
