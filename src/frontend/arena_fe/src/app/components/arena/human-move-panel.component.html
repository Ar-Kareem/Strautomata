@if (show) {
  <div class="human-move-panel">
    <p class="human-move-hint">{{ hint }}</p>
    @if (transientError) {
      <p class="human-move-error">{{ transientError }}</p>
    }
    @if (actionLabel) {
      <button
        class="ghost-button"
        type="button"
        [disabled]="actionDisabled"
        (click)="action.emit()"
      >
        {{ actionLabel }}
      </button>
    }
  </div>
}
