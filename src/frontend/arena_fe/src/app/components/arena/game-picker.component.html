<button
  class="gpk-trigger"
  type="button"
  aria-label="Game"
  aria-haspopup="listbox"
  [attr.aria-expanded]="open()"
  (click)="toggle()"
>
  @if (selected(); as game) {
    <game-preview class="gpk-thumb" [gameId]="game.gameId" [worldId]="game.worldId" [animate]="false"></game-preview>
    <span class="gpk-name">{{ game.label }}</span>
  } @else if (allLabel()) {
    <span class="gpk-thumb gpk-all-icon"><i class="fa-solid fa-trophy" aria-hidden="true"></i></span>
    <span class="gpk-name">{{ allLabel() }}</span>
  } @else {
    <span class="gpk-thumb"></span>
    <span class="gpk-name is-placeholder">Choose a game</span>
  }
  <i class="fa-solid fa-chevron-down gpk-chevron" aria-hidden="true"></i>
</button>

@if (open()) {
  <ul class="gpk-popup" role="listbox" aria-label="Game" [style]="popupStyle()">
    @if (allLabel()) {
      <li
        class="gpk-option"
        role="option"
        [attr.aria-selected]="selectedId() === null"
        [class.is-selected]="selectedId() === null"
        (click)="choose(null)"
      >
        <span class="gpk-option-board gpk-all-icon"><i class="fa-solid fa-trophy" aria-hidden="true"></i></span>
        <span class="gpk-option-name">{{ allLabel() }}</span>
      </li>
    }
    @for (game of games(); track game.id) {
      <li
        class="gpk-option"
        role="option"
        [attr.aria-selected]="game.id === selectedId()"
        [class.is-selected]="game.id === selectedId()"
        (click)="choose(game.id)"
      >
        <game-preview class="gpk-option-board" [gameId]="game.gameId" [worldId]="game.worldId"></game-preview>
        <span class="gpk-option-name">{{ game.label }}</span>
      </li>
    }
  </ul>
}
