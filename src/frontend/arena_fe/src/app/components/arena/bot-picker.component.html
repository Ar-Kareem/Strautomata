<button
  class="bp-trigger"
  type="button"
  [disabled]="disabled()"
  [attr.aria-label]="label()"
  aria-haspopup="listbox"
  [attr.aria-expanded]="open()"
  (click)="toggle()"
>
  @if (selected(); as row) {
    <span class="bp-logo">
      @if (row.logo) {
        <img [src]="row.logo" alt="" />
      } @else {
        <i class="fa-solid {{ row.icon }}" aria-hidden="true"></i>
      }
    </span>
    <span class="bp-name" [attr.title]="row.label">{{ row.label }}</span>
  } @else {
    <span class="bp-name bp-placeholder">Select automaton</span>
  }
  <i class="fa-solid fa-chevron-down bp-chevron" aria-hidden="true"></i>
</button>

@if (open()) {
  <div class="bp-popup" [style]="popupStyle()">
    <div class="bp-toolbar">
      <label class="bp-show-all" [class.is-disabled]="!showAllEnabled()" [attr.title]="showAllTooltip() || null">
        <input type="checkbox" [checked]="showAll()" [disabled]="!showAllEnabled()" (change)="onShowAll($event)" />
        <span>Show all automata</span>
      </label>
      <div class="bp-sort" role="radiogroup" aria-label="Sort automata by">
        <span class="bp-sort-label">Sort</span>
        <button type="button" role="radio" [attr.aria-checked]="sortMode() === 'elo'" [class.is-active]="sortMode() === 'elo'" (click)="setSort('elo')">Elo</button>
        <button type="button" role="radio" [attr.aria-checked]="sortMode() === 'name'" [class.is-active]="sortMode() === 'name'" (click)="setSort('name')">Name</button>
      </div>
    </div>
    <ul class="bp-list" role="listbox" [attr.aria-label]="label()">
      @for (row of rows(); track row.id) {
        <li
          class="bp-option"
          role="option"
          [attr.aria-selected]="row.id === selectedId()"
          [class.is-selected]="row.id === selectedId()"
          [class.is-disabled]="row.disabled"
          (click)="choose(row)"
        >
          <span class="bp-logo">
            @if (row.logo) {
              <img [src]="row.logo" alt="" loading="lazy" />
            } @else {
              <i class="fa-solid {{ row.icon }}" aria-hidden="true"></i>
            }
          </span>
          <span class="bp-name">{{ row.label }}</span>
          <span class="bp-elo" [class.is-dnq]="row.elo === null">{{ eloText(row) }}</span>
        </li>
      }
    </ul>
  </div>
}
