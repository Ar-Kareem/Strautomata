@if (guiComponent() && frames().length) {
  <div
    class="gp-inner game-gui"
    [style.min-width.px]="naturalWidth"
    [style.zoom]="scale()"
  >
    <ng-container [ngComponentOutlet]="guiComponent()" [ngComponentOutletInputs]="guiInputs()"></ng-container>
  </div>
} @else {
  <div class="gp-empty" aria-hidden="true"></div>
}
