<section class="entrypoint-grid">
  <arena-entrypoint-hero></arena-entrypoint-hero>
  <div class="panel panel-primary" id="games">
    <div class="panel-head">
      <div>
        <h2>Battle automata or watch them battle</h2>
      </div>
    </div>
    <div class="play-grid">
      @for (game of games; track game.gameId + '/' + game.worldId; let i = $index) {
        <button class="play-card" type="button" [style.--delay]="(i * 0.03) + 's'" (click)="playGame(game)" (pointerenter)="prefetchGame(game)" (focus)="prefetchGame(game)">
          <game-preview class="play-card-board" [gameId]="game.gameId" [worldId]="game.worldId"></game-preview>
          <span class="play-card-foot">
            <span class="play-card-title">{{ game.label }}</span>
            <span class="play-card-cta">Play ▶</span>
          </span>
        </button>
      }
    </div>
  </div>
</section>
