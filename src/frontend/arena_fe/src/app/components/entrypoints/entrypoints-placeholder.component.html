<section class="entrypoint-grid">
  <div class="panel panel-secondary entrypoint-placeholder">
    <div class="panel-head">
      <div>
        <h2>{{ activeEntry?.label ?? 'Entrypoint' }}</h2>
        <p>{{ activeEntry?.summary ?? 'This entrypoint is not available yet.' }}</p>
      </div>
      <button class="ghost-button" type="button" (click)="resetEntry()">
        Switch entrypoint
      </button>
    </div>
    <div class="entrypoint-placeholder-body">
      <p>This workflow is queued for a future drop. Pick Game Arena to run matches now.</p>
    </div>
  </div>
</section>
