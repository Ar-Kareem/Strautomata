<div class="corewar-viewer">
  <div class="corewar-canvas-slot" #coreCanvasSlot>
    <div class="corewar-canvas-shell" #coreCanvasShell>
      <div class="corewar-canvas-frame">
        <corewar-viewer-input-layer
          #inputLayer
          [canvasSize]="canvasSize"
          [instructionCount]="currentInstructions.length"
          [cellSize]="cellSize"
          [coreColumns]="coreColumns"
          (interactionChanged)="onCanvasInteractionChanged()"
        ></corewar-viewer-input-layer>
        <canvas
          #overlayCanvas
          class="corewar-overlay-canvas"
          aria-hidden="true"
        ></canvas>
        <canvas
          #hoverCanvas
          class="corewar-hover-canvas"
          aria-hidden="true"
        ></canvas>
      </div>
      <corewar-viewer-legend-panel
        [boardCanvas]="inputLayer.canvasElement"
        [canvasShell]="coreCanvasShell"
        [cellSize]="cellSize"
        [showIcons]="showIcons"
        [drawOpcodePixels]="legendOpcodeDrawer"
      ></corewar-viewer-legend-panel>
    </div>
  </div>

  <corewar-viewer-settings-dialog
    class="corewar-view-settings-host"
    (settingsSaved)="onSettingsSaved($event)"
  ></corewar-viewer-settings-dialog>

  <corewar-viewer-inspector-panel
    class="corewar-inspector-host"
    [hoverRange]="hoverRange"
    [instructions]="currentInstructions"
    [addresses]="currentAddresses"
    [owners]="currentOwners"
    [showLastModifiedColor]="showLastModifiedColor"
    [processMetaForAddress]="processHoverMetaForAddress"
    [hoverListVersion]="hoverListVersion"
    [lockedIndex]="lockedIndex"
    [lockedRange]="lockedRange"
  ></corewar-viewer-inspector-panel>
</div>
