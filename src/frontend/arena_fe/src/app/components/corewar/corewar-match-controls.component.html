<div class="corewar-actions">
  @if (!matchId) {
    <button class="primary-button" type="button" (click)="startMatch.emit()" [disabled]="loading">
      Start
    </button>
  } @else {
    @if (roundDone && !matchDone) {
      <button class="ghost-button" type="button" (click)="nextRound.emit()">
        Next Round <i class="fa-solid fa-angle-right" aria-hidden="true"></i>
      </button>
    } @else if (!matchDone) {
      <button
        class="ghost-button"
        [class.corewar-play-button]="!running"
        [class.corewar-pause-button]="running"
        type="button"
        (click)="toggleRunning.emit()"
        [attr.aria-label]="running ? 'Pause (space)' : 'Run (space)'"
        [attr.title]="running ? 'Pause (space)' : 'Run (space)'"
      >
        @if (running) {
          <i class="fa-solid fa-pause" aria-hidden="true"></i>
        } @else {
          <i class="fa-solid fa-play" aria-hidden="true"></i>
        }
      </button>
    }
    @if (!roundDone) {
      <button
        class="ghost-button"
        type="button"
        (click)="stepOnce.emit()"
        aria-label="Step once (→/F/L/.)"
        title="Step once (→/F/L/.)"
      >
        Step
      </button>
    }
  }
</div>

<p-dialog
  header="Core Configuration"
  [visible]="configVisible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="true"
  [appendTo]="'body'"
  [style]="{ width: '26rem' }"
  (onShow)="onConfigShow()"
  (onHide)="closeConfig()"
>
  <div class="corewar-config-body">
    <div class="corewar-config-row">
      <label class="corewar-config-label" for="corewar-config-rounds">Rounds</label>
      <input
        id="corewar-config-rounds"
        class="corewar-config-input"
        type="number"
        min="1"
        pInputText
        [(ngModel)]="draftConfig.rounds"
      />
    </div>
    <div class="corewar-config-row">
      <label class="corewar-config-label" for="corewar-config-size">Core size</label>
      <input
        id="corewar-config-size"
        class="corewar-config-input"
        type="number"
        min="1"
        pInputText
        [(ngModel)]="draftConfig.size"
      />
    </div>
    <div class="corewar-config-row">
      <label class="corewar-config-label" for="corewar-config-cycles">Cycles</label>
      <input
        id="corewar-config-cycles"
        class="corewar-config-input"
        type="number"
        min="1"
        pInputText
        [(ngModel)]="draftConfig.cycles"
      />
    </div>
    <div class="corewar-config-row">
      <label class="corewar-config-label" for="corewar-config-processes">Max processes</label>
      <input
        id="corewar-config-processes"
        class="corewar-config-input"
        type="number"
        min="1"
        pInputText
        [(ngModel)]="draftConfig.processes"
      />
    </div>
    <div class="corewar-config-row">
      <label class="corewar-config-label" for="corewar-config-length">Max length</label>
      <input
        id="corewar-config-length"
        class="corewar-config-input"
        type="number"
        min="1"
        pInputText
        [(ngModel)]="draftConfig.length"
      />
    </div>
    <div class="corewar-config-row">
      <label class="corewar-config-label" for="corewar-config-distance">Min distance</label>
      <input
        id="corewar-config-distance"
        class="corewar-config-input"
        type="number"
        min="0"
        pInputText
        [(ngModel)]="draftConfig.distance"
      />
    </div>
    <div class="corewar-config-row">
      <label class="corewar-config-label" for="corewar-config-seed">Match seed</label>
      <input
        id="corewar-config-seed"
        class="corewar-config-input"
        type="number"
        min="0"
        pInputText
        [(ngModel)]="draftConfig.seed"
      />
    </div>
    <div class="corewar-config-actions">
      <button class="ghost-button corewar-config-reset" type="button" (click)="resetConfig()">Reset</button>
      <button class="ghost-button" type="button" (click)="closeConfig()">Cancel</button>
      <button class="primary-button" type="button" (click)="applyConfig()">Apply</button>
    </div>
  </div>
</p-dialog>

@if (matchId) {
  <div class="corewar-tuning">
    <label class="corewar-tuning-label" for="corewar-speed">Speed</label>
    <input
      #speedInput
      id="corewar-speed"
      class="corewar-tuning-range"
      type="range"
      min="0"
      max="600"
      step="1"
      [value]="sliderValue"
      (input)="onSpeedInput(speedInput)"
    />
    <div class="corewar-speed-field">
      <button
        class="corewar-tuning-value corewar-speed-display"
        type="button"
        (click)="openSpeedEdit()"
      >
        <span class="corewar-speed-number">{{ moveSpeed }}</span>
        <span class="corewar-speed-unit">moves/s</span>
      </button>
      @if (speedEditOpen) {
        <div class="corewar-speed-popover-backdrop" (click)="closeSpeedEdit(true)"></div>
        <div class="corewar-speed-popover" (click)="$event.stopPropagation()">
          <input
            #speedPopoverInput
            class="corewar-speed-popover-input"
            type="number"
            min="0"
            max="2000"
            [value]="speedEditValue"
            (input)="onSpeedEditInput($event)"
            (keydown.enter)="closeSpeedEdit(true)"
            (keydown.escape)="closeSpeedEdit(false)"
          />
        </div>
      }
    </div>
  </div>
}
