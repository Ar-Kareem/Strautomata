<canvas
  #legendCanvas
  class="corewar-legend-canvas"
  [style.display]="showIcons ? 'block' : 'none'"
  aria-hidden="true"
  (mousemove)="onLegendMove($event)"
  (mouseleave)="onLegendLeave()"
></canvas>
@if (showIcons && legendTooltip) {
  <div class="corewar-legend-tooltip" [style.left.px]="legendTooltip.x" [style.top.px]="legendTooltip.y">
    {{ legendTooltip.text }}
  </div>
}
