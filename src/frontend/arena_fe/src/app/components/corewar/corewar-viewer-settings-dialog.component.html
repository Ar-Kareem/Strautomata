<button
  class="ghost-button corewar-view-settings corewar-view-settings--inline"
  type="button"
  aria-label="Live view size"
  title="Live view size"
  (click)="openInspectorDialog()"
>
  <i class="fa-solid fa-gear" aria-hidden="true"></i>
</button>

<p-dialog
  header="Settings"
  [visible]="inspectorDialogOpen"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="true"
  [appendTo]="'body'"
  [style]="{ width: '22rem' }"
  (document:keydown.enter)="saveInspectorDialog($event)"
  (document:keydown.escape)="closeInspectorDialog($event)"
  (onHide)="closeInspectorDialog()"
>
  <div class="corewar-inspector-dialog">
    <div class="corewar-inspector-dialog-title">Canvas Size</div>
    <div class="corewar-inspector-dialog-row">
      <label class="corewar-inspector-dialog-label" for="corewar-max-columns">Cells per Row</label>
      <input
        id="corewar-max-columns"
        class="corewar-inspector-dialog-input"
        type="number"
        [value]="maxColumnsDraft"
        (input)="onMaxColumnsInput($event)"
      />
    </div>
    <div class="corewar-inspector-dialog-row">
      <label class="corewar-inspector-dialog-label" for="corewar-cell-size">Cell Size</label>
      <input
        id="corewar-cell-size"
        class="corewar-inspector-dialog-input"
        type="number"
        [value]="cellSizeSettingDraft"
        (input)="onCellSizeInput($event)"
      />
    </div>
    <div class="corewar-inspector-dialog-title">View size</div>
    <div class="corewar-inspector-dialog-options">
      <label>
        <input
          type="radio"
          name="corewar-live-size"
          [value]="1"
          [checked]="inspectorViewSizeDraft === 1"
          (change)="setInspectorViewSizeDraft(1)"
        />
        1
      </label>
      <label>
        <input
          type="radio"
          name="corewar-live-size"
          [value]="11"
          [checked]="inspectorViewSizeDraft === 11"
          (change)="setInspectorViewSizeDraft(11)"
        />
        11
      </label>
      <label>
        <input
          type="radio"
          name="corewar-live-size"
          [value]="inspectorViewSizeMax"
          [checked]="inspectorViewSizeDraft === inspectorViewSizeMax"
          (change)="setInspectorViewSizeDraft(inspectorViewSizeMax)"
        />
        Max ({{ inspectorViewSizeMax }})
      </label>
    </div>
    <div class="corewar-inspector-dialog-title">Cell Style</div>
    <label class="corewar-inspector-dialog-toggle">
      <input
        type="checkbox"
        [checked]="showIconsDraft"
        (change)="onShowIconsChange($event)"
      />
      Show Opcode Icons
    </label>
    <label class="corewar-inspector-dialog-toggle" [class.is-disabled]="showIconsDraft">
      <input
        type="checkbox"
        [checked]="makeNonDatWhiteDraft"
        [disabled]="showIconsDraft"
        (change)="onMakeNonDatWhiteChange($event)"
      />
      Make non-DAT White
    </label>
    <label class="corewar-inspector-dialog-toggle">
      <input
        type="checkbox"
        [checked]="showLastModifiedColorDraft"
        (change)="onShowLastModifiedColorChange($event)"
      />
      Last Modified Color
    </label>
    <label class="corewar-inspector-dialog-toggle" [class.is-disabled]="showLastModifiedColorDraft">
      <input
        type="checkbox"
        [checked]="makeWarriorDatWhiteDraft"
        [disabled]="showLastModifiedColorDraft"
        (change)="onMakeWarriorDatWhiteChange($event)"
      />
      Make Warrior DAT White
    </label>
    <div class="corewar-inspector-dialog-title">Other</div>
    <label class="corewar-inspector-dialog-toggle">
      <input
        type="checkbox"
        [checked]="detailedScoreboardDraft"
        (change)="onDetailedScoreboardChange($event)"
      />
      Detailed Scoreboard
    </label>
  </div>
  <div class="corewar-inspector-dialog-actions">
    <button
      class="ghost-button corewar-inspector-dialog-reset"
      type="button"
      (click)="resetInspectorDialog()"
    >
      Reset
    </button>
    <div class="corewar-inspector-dialog-actions-right">
      <button class="primary-button" type="button" (click)="saveInspectorDialog()">Save</button>
    </div>
  </div>
</p-dialog>
