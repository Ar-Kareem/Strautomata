<button type="button" class="ghost-button mv-small hf-trigger" [attr.aria-expanded]="open()" (click)="open.set(!open())">
  <i class="fa-solid fa-filter" aria-hidden="true"></i>
  Filter{{ hiddenCount() ? ' (' + hiddenCount() + ' hidden)' : '' }}
</button>
@if (open()) {
  <div class="hf-popup" role="dialog" aria-label="Filter models">
    <div class="hf-actions">
      <button type="button" (click)="showAll()">All</button>
      <button type="button" (click)="showNone()">None</button>
    </div>
    <div class="hf-list">
      @for (group of groups(); track group.family) {
        <div class="hf-family">
          <label class="hf-family-row">
            <input
              type="checkbox"
              [checked]="familyState(group) === 'all'"
              [indeterminate]="familyState(group) === 'some'"
              (change)="toggleFamily(group)"
            />
            <model-logo [family]="group.family" [size]="14"></model-logo>
            <span>{{ group.family }}</span>
          </label>
          @for (model of group.models; track model.id) {
            <label class="hf-model-row">
              <input type="checkbox" [checked]="!hidden().has(model.id)" (change)="toggleModel(model.id)" />
              <span class="hf-model">{{ model.id }}</span>
              @if (model.count > 1) {
                <span class="hf-count">{{ model.count }}</span>
              }
            </label>
          }
        </div>
      }
    </div>
  </div>
}
