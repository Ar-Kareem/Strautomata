@if (rows().length) {
  <section class="ma">
    <span class="ma-title">Automata</span>
    <div class="ma-grid">
      @for (row of rows(); track row.a.bot) {
        <article class="ma-card" [class.is-dnq]="!row.a.qualified" [class.is-wide]="expanded() === row.a.bot"
          (click)="expanded() !== row.a.bot && expanded.set(row.a.bot)"
        >
          <header class="ma-card-head" (click)="toggle(row.a.bot); $event.stopPropagation()">
          <matches-bot-chip [automaton]="row.a" [tip]="row.tip" [top]="row.top" (pick)="pick(row.a)"></matches-bot-chip>
          @if (row.a.tourney; as t) {
            <span class="ma-fact">#{{ t.rank }} · {{ formatRating(t.rating) }}</span>
          } @else {
            <span class="ma-fact ma-dnq">Did not qualify</span>
          }
          <span class="ma-actions">
            <matches-fight-button [game]="game()" [bot]="row.a.bot"></matches-fight-button>
            @if (expanded() === row.a.bot) {
              <button type="button" class="ma-close" aria-label="Close">
                Close <i class="fa-solid fa-chevron-up" aria-hidden="true"></i>
              </button>
            }
          </span>
        </header>
          <matches-automaton-source
            [game]="game()"
            [bot]="row.a.bot"
            [lines]="5"
            [open]="expanded() === row.a.bot"
            (openChange)="expanded.set($event ? row.a.bot : null)"
          ></matches-automaton-source>
        </article>
      }
    </div>
  </section>
}
