// Game parameters

var game = 'reversum';
var startclock = Infinity;
var playclock = Infinity;

function dogame ()
 {game = prompt("What game do you want to play?");
  location.href = makeurl();
  return true}

function dostartclock ()
 {startclock = prompt("How many seconds on the start clock?");
  location.href = makeurl();
  return true}

function doplayclock ()
 {playclock = prompt("How many seconds on the play clock?");
  location.href = makeurl();
  return true}

function makeurl ()
 {return (window.VS_LLM_CONFIG && window.VS_LLM_CONFIG.currentPath) || ('/vs_llm/' + game + '/')}

//==============================================================================
// End of game parameters
//==============================================================================
  </script>
  <script type='text/javascript'>
//==============================================================================
// reversi
//==============================================================================

function renderstate (state)
 {var role = compfindx('R',seq('control','R'),state,library);
  var table = document.createElement('table');
  table.setAttribute('border','0');
  var row = table.insertRow(0);
  var cell = row.insertCell(0);
  cell.setAttribute('align','center');
  cell.setAttribute('style','font-size:20px');
  var board = renderboard(state);
  cell.appendChild(board);
  row = table.insertRow(1);
  var cell = row.insertCell(0);
  cell.setAttribute('align','center');
  cell.setAttribute('style','font-size:20px');
  if (compfindp('terminal',state,library))
     {cell.innerHTML = 'Game over'}
     else {cell.innerHTML = 'Control:  ' + role};
  return table}

function renderboard (state)
 {var table = document.createElement('table');
  table.setAttribute('cellspacing','0');
  table.setAttribute('cellpadding','0');
  table.setAttribute('border','1');
  for (var i=0; i<6; i++)
      {var row = table.insertRow(i);
       var rownum = String(6-i);
       for (var j=0; j<6; j++)
           {var cell = row.insertCell(j);
            var colnum = String(j+1);
            var filler = compfindx('Z',seq('cell',colnum,rownum,'Z'),state,seq());
            cell.height='40';
            cell.width='40';
            cell.align='center';
            cell.valign='center';
            if (filler=='red')
               {cell.innerHTML = '<img src="/library/reversum/red.png" height="30"/>'};
            if (filler=='blue')
               {cell.innerHTML = '<img src="/library/reversum/blue.png" height="30"/>'};
            if (filler==false)
               {cell.innerHTML = '&nbsp;'}}};
  return table}

//==============================================================================
//==============================================================================
//==============================================================================
  </script>

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% reversum
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% metadata
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

role(red)
role(blue)

base(cell(X,Y,R)) :- index(X) & index(Y) & role(R)
base(control(R)) :- role(R)

action(move(X,Y)) :- index(X) & index(Y)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% init
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

init(cell(3,3,blue))
init(cell(3,4,red))
init(cell(4,3,red))
init(cell(4,4,blue))
init(control(red))

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% legal
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

legal(move(X,Y)) :-
  cell(U,V,R) &  nextcellindir(U,V,Dir,X,Y) &
  ~cell(X,Y,red) & ~cell(X,Y,blue)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% operations
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

move(X,Y) :: control(R) ==> cell(X,Y,R)

move(U,V) :: control(R) & affectedcell(R,U,V,X,Y) & cell(X,Y,S)
  ==> ~cell(X,Y,S) & cell(X,Y,R)

move(X,Y) :: control(red) ==> ~control(red) & control(blue)
move(X,Y) :: control(blue) ==> ~control(blue) & control(red)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% goal
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

goal(R,N) :- ~terminal & score(R,N)
goal(R,N) :- terminal & score(R,M) & scoremap(M,N)

score(R,N) :- countofall(cell(X,Y),cell(X,Y,R),N)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% terminal
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

terminal :- ~playable

playable :- empty(X,Y)
empty(X,Y) :- index(X) & index(Y) & ~occupied(X,Y)
occupied(X,Y) :- cell(X,Y,R)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% Views
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

affectedcell(Color,U,V,X2,Y2) :-
  affecteddir(Color,U,V,Dir) &
  opponent(Color,Other) &
  nextcellindir(U,V,Dir,X1,Y1) &
  affectedcellindir(Other,X1,Y1,Dir,X2,Y2)


affecteddir(Color,U,V,Dir) :-
  nextcellindir(U,V,Dir,X,Y) &
  captureindir(Other,X,Y,Color,Dir)


nextcellindir(X1,Y1,Dir,X2,Y2) :-
  dir(Dir,Xdelta,Ydelta) &
  add(X1,Xdelta,X2) &
  add(Y1,Ydelta,Y2)


affectedcellindir(Other,X1,Y1,Dir,X1,Y1) :- cell(X1,Y1,Other)

affectedcellindir(Other,X1,Y1,Dir,X3,Y3) :-
  cell(X1,Y1,Other) &
  nextcellindir(X1,Y1,Dir,X2,Y2) &
  affectedcellindir(Other,X2,Y2,Dir,X3,Y3)


captureindir(Other,X1,Y1,Color,Dir) :-
  cell(X1,Y1,Other) &
  nextcellindir(X1,Y1,Dir,X2,Y2) &
  cell(X2,Y2,Color)

captureindir(Other,X1,Y1,Color,Dir) :-
  cell(X1,Y1,Other) &
  nextcellindir(X1,Y1,Dir,X2,Y2) &
  captureindir(Other,X2,Y2,Color,Dir)
