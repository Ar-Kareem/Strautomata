//==============================================================================
// Game parameters

var game = 'alquerque';
var startclock = Infinity;
var playclock = Infinity;

function dogame ()
 {game = prompt("What game do you want to play?");
  location.href = makeurl();
  return true}

function dostartclock ()
 {startclock = prompt("How many seconds on the start clock?");
  location.href = makeurl();
  return true}

function doplayclock ()
 {playclock = prompt("How many seconds on the play clock?");
  location.href = makeurl();
  return true}

function makeurl ()
 {return (window.VS_LLM_CONFIG && window.VS_LLM_CONFIG.currentPath) || ('/vs_llm/' + game + '/')}

//==============================================================================
// End of game parameters
//==============================================================================

  <script type='text/javascript'>
//==============================================================================
// alquerque
//==============================================================================

function renderstate (state)
 {var step = compfindx('N',seq('step','N'),state,library);
  var role = compfindx('R',seq('control','R'),state,library);
  var table = document.createElement('table');
  table.setAttribute('border','0');
  var row = table.insertRow(0);
  var cell = row.insertCell(0);
  cell.setAttribute('align','center');
  cell.setAttribute('style','font-size:20px');
  cell.innerHTML = 'Step:  ' + step;
  row = table.insertRow(1);
  var cell = row.insertCell(0);
  var board = renderboard(state);
  cell.appendChild(board);
  row = table.insertRow(2);
  var cell = row.insertCell(0);
  cell.setAttribute('align','center');
  cell.setAttribute('style','font-size:20px');
  if (compfindp('terminal',state,library))
     {cell.innerHTML = 'Game over'}
     else {cell.innerHTML = 'Control:  ' + role};
  return table}

function renderboard (state)
 {var canvas = document.createElement('canvas');
  canvas.setAttribute('width','270px');
  canvas.setAttribute('height','270px');

  drawline( 15, 15,255, 15,canvas);
  drawline( 15, 75,255, 75,canvas);
  drawline( 15,135,255,135,canvas);
  drawline( 15,195,255,195,canvas);
  drawline( 15,255,255,255,canvas);

  drawline( 15, 15, 15,255,canvas);
  drawline( 75, 15, 75,255,canvas);
  drawline(135, 15,135,255,canvas);
  drawline(195, 15,195,255,canvas);
  drawline(255, 15,255,255,canvas);

  drawline( 15, 15,255,255,canvas);
  drawline( 15,255,255, 15,canvas);
  drawline(135, 15, 15,135,canvas);
  drawline( 15,135,135,255,canvas);
  drawline(135,255,255,135,canvas);
  drawline(255,135,135, 15,canvas);

  drawnode('1','1',  0,  0,state,canvas);
  drawnode('1','2', 60,  0,state,canvas);
  drawnode('1','3',120,  0,state,canvas);
  drawnode('1','4',180,  0,state,canvas);
  drawnode('1','5',240,  0,state,canvas);

  drawnode('2','1',  0, 60,state,canvas);
  drawnode('2','2', 60, 60,state,canvas);
  drawnode('2','3',120, 60,state,canvas);
  drawnode('2','4',180, 60,state,canvas);
  drawnode('2','5',240, 60,state,canvas);

  drawnode('3','1',  0,120,state,canvas);
  drawnode('3','2', 60,120,state,canvas);
  drawnode('3','3',120,120,state,canvas);
  drawnode('3','4',180,120,state,canvas);
  drawnode('3','5',240,120,state,canvas);

  drawnode('4','1',  0,180,state,canvas);
  drawnode('4','2', 60,180,state,canvas);
  drawnode('4','3',120,180,state,canvas);
  drawnode('4','4',180,180,state,canvas);
  drawnode('4','5',240,180,state,canvas);

  drawnode('5','1',  0,240,state,canvas);
  drawnode('5','2', 60,240,state,canvas);
  drawnode('5','3',120,240,state,canvas);
  drawnode('5','4',180,240,state,canvas);
  drawnode('5','5',240,240,state,canvas);

  return canvas}

//------------------------------------------------------------------------------
// Drawing subroutines
//------------------------------------------------------------------------------

function drawred (x,y,w)
 {var ctx = w.getContext('2d');
  ctx.beginPath();
  ctx.lineWidth=2;
  ctx.arc(x+15,y+15,12,0,2*Math.PI,false);
  ctx.stroke();
  ctx.fillStyle = "#ff8888";
  ctx.fill();}

function drawblack (x,y,w)
 {var ctx = w.getContext('2d');
  ctx.beginPath();
  ctx.lineWidth=2;
  ctx.arc(x+15,y+15,12,0,2*Math.PI,false);
  ctx.stroke();
  ctx.fillStyle = "#888888";
  ctx.fill();}

function drawblank (x,y,w)
 {var ctx = w.getContext('2d');
  ctx.beginPath();
  ctx.lineWidth=2;
  ctx.arc(x+15,y+15,12,0,2*Math.PI,false);
  ctx.stroke();
  ctx.fillStyle = "#ffffff";
  ctx.fill();}

function drawline(u,v,x,y,w)
 {var ctx = w.getContext('2d');
  ctx.beginPath();
  ctx.lineWidth=2;
  ctx.moveTo(u,v);
  ctx.lineTo(x,y);
  ctx.stroke()}

function drawnode (m,n,x,y,state,canvas)
 {var mark = compfindx('X',seq('cell',m,n,'X'),state,library);
  if (mark=='red') {drawred(x,y,canvas); return true};
  if (mark=='black') {drawblack(x,y,canvas); return true};
  drawblank(x,y,canvas);
  return true}

function drawscore (text,x,y,w)
 {var ctx = w.getContext('2d');
  ctx.fillStyle = "#000000";
  ctx.font="28px Times"
  ctx.fillText(text,x+12,y+18);
  return true}

//==============================================================================
//==============================================================================
//==============================================================================

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% alquerque
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% metadata
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

role(red)
role(black)

base(cell(M,N,Mark)) :- index(M) & index(N) & mark(Mark)
base(score(Role,0)) :- role(Role)
base(score(Role,N)) :- role(Role) & incr(M,N)
base(control(Role)) :- role(Role)
base(step(1)) :- true
base(step(N)) :- succ(M,N)
base(control(red))
base(control(black))

action(move(U,V,X,Y)) :- doublet(U,V,X,Y)
action(jump(U,V,W,X,Y,Z)) :- triplet(U,V,W,X,Y,Z)
action(kerchunk)

index(1)
index(2)
index(3)
index(4)
index(5)

mark(black)
mark(red)
mark(blank)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% init
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

init(cell(1,1,black))
init(cell(1,2,black))
init(cell(1,3,black))
init(cell(1,4,black))
init(cell(1,5,black))
init(cell(2,1,black))
init(cell(2,2,black))
init(cell(2,3,black))
init(cell(2,4,black))
init(cell(2,5,black))
init(cell(3,1,blank))
init(cell(3,2,blank))
init(cell(3,3,blank))
init(cell(3,4,blank))
init(cell(3,5,blank))
init(cell(4,1,red))
init(cell(4,2,red))
init(cell(4,3,red))
init(cell(4,4,red))
init(cell(4,5,red))
init(cell(5,1,red))
init(cell(5,2,red))
init(cell(5,3,red))
init(cell(5,4,red))
init(cell(5,5,red))
init(score(red,0))
init(score(black,0))
init(control(red))
init(step(1))

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% legal
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

legal(Move) :- goodmove(Move)

goodmove(move(U,V,X,Y)) :-
  control(Role) &
  cell(U,V,Role) &
  doublet(U,V,X,Y) &
  cell(X,Y,blank)

goodmove(jump(U,V,W,X,Y,Z)) :-
  control(red) &
  cell(U,V,red) &
  triplet(U,V,W,X,Y,Z) &
  cell(W,X,black) &
  cell(Y,Z,blank)

goodmove(jump(U,V,W,X,Y,Z)) :-
  control(black) &
  cell(U,V,black) &
  triplet(U,V,W,X,Y,Z) &
  cell(W,X,red) &
  cell(Y,Z,blank)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% operations
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

move(U,V,X,Y) :: cell(U,V,Role) ==> ~cell(U,V,Role) & cell(U,V,blank)
move(U,V,X,Y) :: cell(U,V,Role) ==> ~cell(X,Y,blank) & cell(X,Y,Role)
move(U,V,X,Y) :: kerchunk

jump(U,V,W,X,Y,Z) :: cell(U,V,Role) ==> ~cell(U,V,Role) & cell(U,V,blank)
jump(U,V,W,X,Y,Z) :: cell(W,X,Role) ==> ~cell(W,X,Role) & cell(W,X,blank)
jump(U,V,W,X,Y,Z) :: cell(U,V,Role) ==> ~cell(Y,Z,blank) & cell(Y,Z,Role)
jump(U,V,W,X,Y,Z) :: control(Role) & score(Role,M) & incr(M,N)
  ==> ~score(Role,M) & score(Role,N)
jump(U,V,W,X,Y,Z) :: kerchunk

kerchunk :: control(black) ==> ~control(black) & control(red)
kerchunk :: control(red) ==> ~control(red) & control(black)
kerchunk :: step(M) & succ(M,N) ==> ~step(M) & step(N)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% goal
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

goal(Role,N) :- score(Role,N)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% terminal
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

terminal :- score(Role,100)
terminal :- ~legalmove
terminal :- step(30)

legalmove :- goodmove(Move)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% Views
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

doublet(U,V,X,Y) :- horizontal(U,V,X,Y)
doublet(U,V,X,Y) :- horizontal(X,Y,U,V)
doublet(U,V,X,Y) :- vertical(U,V,X,Y)
doublet(U,V,X,Y) :- vertical(X,Y,U,V)
doublet(U,V,X,Y) :- slash(U,V,X,Y)
doublet(U,V,X,Y) :- slash(X,Y,U,V)
doublet(U,V,X,Y) :- backslash(U,V,X,Y)
doublet(U,V,X,Y) :- backslash(X,Y,U,V)

triplet(U,V,W,X,Y,Z) :- horizontal(U,V,W,X) & horizontal(W,X,Y,Z)
triplet(U,V,W,X,Y,Z) :- horizontal(Y,Z,W,X) & horizontal(W,X,U,V)
triplet(U,V,W,X,Y,Z) :- vertical(U,V,W,X) & vertical(W,X,Y,Z)
triplet(U,V,W,X,Y,Z) :- vertical(Y,Z,W,X) & vertical(W,X,U,V)
triplet(U,V,W,X,Y,Z) :- slash(U,V,W,X) & slash(W,X,Y,Z)
triplet(U,V,W,X,Y,Z) :- slash(Y,Z,W,X) & slash(W,X,U,V)
triplet(U,V,W,X,Y,Z) :- backslash(U,V,W,X) & backslash(W,X,Y,Z)
triplet(U,V,W,X,Y,Z) :- backslash(Y,Z,W,X) & backslash(W,X,U,V)

horizontal(U,V,X,V) :- nex(U,X) & index(V)
vertical(U,V,U,Y) :- nex(V,Y) & index(U)
