  <script type='text/javascript'>
//==============================================================================
// Game parameters
//==============================================================================

var manager = 'manager';
var player = 'human';

function doplayer ()
 {player = read(prompt("What is your player's identifier?"));
  document.getElementById('player').innerHTML = player;
  return true}

//==============================================================================
// human.js
//==============================================================================

indexing = false;
dataindexing = false;
ruleindexing = true;

var game = 'buttonsandlights';
var role = 'robot';
var startclock = 10;
var playclock = 10;

var library = [];
var roles = [];
var state = [];
var statelog = [];
var movelog = [];
var messageid = "0";

function initialize ()
 {//document.addEventListener('keydown',handlekey);
  window.addEventListener("storage",handlestorage,false); console.log('listening');
  definerules(library,readdata(document.getElementById('library').textContent));
  roles = findroles(library);
  state = findinits(library);
  statelog = [state];
  movelog = [];
  movenum = 0;
  showstate(state);
  showactions(state);
  showhistory(movelog,state);
  return true}

//==============================================================================

function showstate (state)
 {var stateholder = document.getElementById('stateholder');
  var n = stateholder.childNodes.length;
  for (var i=0; i<n; i++) {stateholder.removeChild(stateholder.childNodes[0])};
  stateholder.appendChild(rendersituation(state));
  return true}

function rendersituation (state)
 {return renderstate(state)}

function renderstate (state)	
 {var widget = document.createElement('textarea');
  widget.setAttribute('rows','12');
  widget.setAttribute('cols','40');
  widget.setAttribute('style','font-family:courier');
  widget.setAttribute('disabled',true);
  widget.value = grindem(state);
  return widget}

//==============================================================================

function showactions (state)
 {var actionholder = document.getElementById('actionholder');
  var n = actionholder.childNodes.length;
  for (var i=0; i<n; i++) {actionholder.removeChild(actionholder.childNodes[0])};
  actionholder.appendChild(renderactions(state));
  return true}

function renderactions (state)
 {var widget = document.createElement('select');
  var option = document.createElement('option');
  option.value = 'error';
  option.text = '';
  widget.add(option);
  var actions = findlegals(state,library).sort();
  for (var i=0; i<actions.length; i++)
      {var option = document.createElement('option');
       var value = grind(actions[i]);
       option.value = value;
       option.text = value;
       widget.add(option)}
  if (findterminalp(state,library)) {widget.disabled = true}
     else {widget.disabled = false};
  widget.setAttribute('onchange','perform(read(this.value))');
  return widget}

//==============================================================================

function showhistory (moves,state)
 {var widget = document.getElementById('history');
  var n = widget.childNodes.length;
  for (var i=0; i<n; i++) {widget.removeChild(widget.childNodes[0])};
  widget.appendChild(renderhistory(moves,state));
  return true}

function renderhistory (moves,state)
 {var widget = document.createElement('table');
  widget.setAttribute('cellspacing',0);
  widget.setAttribute('cellpadding',3);
  widget.setAttribute('border',1);
  var row = widget.insertRow(0);
  var cell = row.insertCell(0);
  cell.innerHTML = 'Step';
  cell.setAttribute('width','120');
  cell.setAttribute('align','center');
  cell.setAttribute('style','font-weight:bold');
  cell.setAttribute('bgcolor','#dddddd');
  for (var j=0; j<roles.length; j++)
      {cell = row.insertCell(j+1);
       cell.innerHTML = roles[j];
       cell.setAttribute('width','120');
       cell.setAttribute('align','center');
       cell.setAttribute('style','font-weight:bold');
       cell.setAttribute('bgcolor','#dddddd')};

  for (var i=0; i<movenum; i++)
      {row = widget.insertRow(i+1);
       cell = row.insertCell(0);
       cell.setAttribute('align','center');
       cell.setAttribute('bgcolor','#dddddd');
       cell.innerHTML = i+1;
       for (var j=0; j<roles.length; j++)
           {cell = row.insertCell(j+1);
            cell.setAttribute('width','120');
            cell.setAttribute('align','center');
            if (findcontrol(statelog[i],library)===roles[j])
               {cell.innerHTML = grind(moves[i])}}};

  row = widget.insertRow(widget.rows.length);
  cell = row.insertCell(0);
  cell.innerHTML = 'Score';
  cell.setAttribute('style','font-weight:bold');
  cell.setAttribute('bgcolor','#dddddd');
  cell.setAttribute('align','center');
  for (var i=0; i<roles.length; i++)
      {cell = row.insertCell(i+1);
       cell.setAttribute('align','center');
       cell.setAttribute('bgcolor','#dddddd');
       cell.innerHTML = findreward(roles[i],state,library)};
  return widget}

//==============================================================================

function perform (action)
 {if (action==='error') {return false};
  //action performed only if in control; could let manager handle for now
  var response = grind(seq('message',messageid,player,manager,action));
  console.log(response);
  send(response);
  //endclock(timekeeper);
  return true}

function copy (obj)
 {return obj.slice(0)}

//==============================================================================

function handlestorage (ev)
 {//console.log(ev);
  console.log(ev.newValue);
  if (ev.key!==player) {return false};
  //var transcript = document.getElementById('transcript');
  //transcript.value = transcript.value + ev.newValue + "\n";
  var envelope = read(ev.newValue);
  messageid = envelope[1]
  var sender = envelope[2]
  var receiver = envelope[3]
  var message = envelope[4]
  if (sender!==manager) {return false};
  if (receiver!==player) {return false};
  console.log("Manager: " + grind(message));
  var answer = ggpeval(message);
  if (!answer) {console.log("Player: no response"); return false};
  var response = grind(seq('message',messageid,player,manager,answer));
  send(response);
  return true}

function send (str)
 {//var transcript = document.getElementById('transcript');
  //transcript.value = transcript.value + str + "\n";
  localStorage.manager = str;
  return true}

//==============================================================================

function ggpeval (msg)
 {if (symbolp(msg)) {return false};
  if (msg[0]==='ping') {return ping()};
  if (msg[0]==='start') {return start(msg[1],msg[2],msg[3],msg[4])};
  if (msg[0]==='play') {return play(msg[1])};
  if (msg[0]==='stop') {return stop(msg[1])};
  if (msg[0]==='abort') {return abort()};
  return false}

//==============================================================================

function ping ()
 {return 'ready'}

function start (r,rs,sc,pc)
 {role = r;
  //library = definemorerules([],rs.slice(1));
  //roles = findroles(library);
  //state = findinits(library);
  startclock = numberize(sc);
  playclock = numberize(pc);
  //timekeeper = beginclock(startclock);
  return 'ready'}

function play (move)
 {if (findcontrol(state,library)!==role) {return false};
  if (move===nil) {return false};
  statelog = statelog.slice(0,movenum+1);
  movelog = movelog.slice(0,movenum);
  movelog.push(move);
  state = simulate(move,state,library)
  statelog.push(state);
  movenum++;
  showstate(state);
  showactions(state);
  showhistory(movelog,state);
  //endclock(timekeeper);
  //timekeeper = beginclock(playclock);  return false}

function stop (move)
 {if (move!=='nil') {state = simulate(move,state,library)};
  movelog = movelog.slice(0,movenum);
  movelog.push(move);
  movenum++;
  showstate(state);
  showactions(state);
  showhistory(movelog,state);
  //endclock(timekeeper);
  return false}

function abort ()
 {//endclock(timekeeper);
  return false}

//------------------------------------------------------------------------------

function simulate (move,state,rules)
 {var deltas = compexpand(move,state,rules);
  var additions = [];
  var deletions = [];
  for (var i=0; i<deltas.length; i++)
      {if (symbolp(deltas[i])) {additions.push(deltas[i]); continue};
       if (deltas[i][0]==='not') {deletions.push(deltas[i][1]); continue};
       additions.push(deltas[i])};
  var newstate = [];
  for (i = 0; i<state.length; i++)
      {if (find(state[i],additions)) {continue};
       if (find(state[i],deletions)) {continue};
       newstate.push(state[i])};
  return newstate.concat(additions)}

//==============================================================================
// Timer//==============================================================================

function beginclock (n)
 {if (n===Infinity) {return false};
  document.getElementById('timer').value = n;
  return setInterval(updateclock,1000)}

function updateclock ()
 {var timer = document.getElementById('timer');
  var time = timer.value - 1;
  timer.value = time;
  if (time<=0) {endclock()};
  return true}

function endclock ()
 {clearclock();
  return true}

function clearclock ()
 {document.getElementById('timer').value = '';
  //clearInterval(timekeeper);
  return true}

//==============================================================================
// Basics
//==============================================================================

function findroles (rules)
 {return compfinds('R',seq('role','R'),seq(),rules)}

function findbases (rules)
 {return compfinds('P',seq('base','P'),seq(),rules)}

function findactions (rules)
 {return compfinds('A',seq('action','A'),seq(),rules)}

function findinits (rules)
 {return compfinds('P',seq('init','P'),seq(),rules)}

function findcontrol (facts,rules)
 {return compfindx('X',seq('control','X'),facts,rules)}

function findlegalp (move,facts,rules)
 {return compfindp(seq('legal',move),facts,rules)}

function findlegalx (facts,rules)
 {return compfindx('X',seq('legal','X'),facts,rules)}

function findlegals (facts,rules)
 {return compfinds('X',seq('legal','X'),facts,rules)}

function findreward (role,facts,rules)
 {var value = compfindx('R',seq('goal',role,'R'),facts,rules);
  if (value) {return value};
  return 0}

function findterminalp (facts,rules)
 {return compfindp('terminal',facts,rules)}

//==============================================================================
// End of Script
//==============================================================================
  </script>

//------------------------------------------------------------------------------
// Chinook

function renderstate (state)
 {var step = compfindx('N',seq('step','N'),state,library);
  var role = compfindx('R',seq('control','R'),state,library);
  var table = document.createElement('table');
  table.setAttribute('border','0');
  var row = table.insertRow(0);
  var cell = row.insertCell(0);
  cell.setAttribute('align','center');
  cell.setAttribute('style','font-size:20px');
  cell.innerHTML = 'Step:  ' + step;
  row = table.insertRow(1);
  var cell = row.insertCell(0);
  var board = renderboard(state);
  cell.appendChild(board);
  row = table.insertRow(2);
  var cell = row.insertCell(0);
  cell.setAttribute('align','center');
  cell.setAttribute('style','font-size:20px');
  if (compfindp('terminal',state,library))
     {cell.innerHTML = 'Game over'}
     else {cell.innerHTML = 'Control:  ' + role};
  return table}

function renderboard (state)
 {var table = document.createElement('table');
  table.setAttribute('cellspacing','2');
  table.setAttribute('bgcolor','#cccccc');
  table.setAttribute('border','4');
  for (var i=8; i>0; i=i-2)
      {var row = table.insertRow(8-i);
       var rank = stringize(i);
       addcell(row,'a',rank,state);
       addcell(row,'b',rank,state);
       addcell(row,'c',rank,state);
       addcell(row,'d',rank,state);
       //addcell(row,'e',rank,state);
       //addcell(row,'f',rank,state);
       //addcell(row,'g',rank,state);
       //addcell(row,'h',rank,state);
       row = table.insertRow(8-i+1);
       var rank = stringize(i-1);
       addcell(row,'a',rank,state);
       addcell(row,'b',rank,state);
       addcell(row,'c',rank,state);
       addcell(row,'d',rank,state);
       //addcell(row,'e',rank,state);
       //addcell(row,'f',rank,state);
       //addcell(row,'g',rank,state);
       //addcell(row,'h',rank,state)
};
  return table}

function addcell (row,file,rank,state)
 {var cell = row.insertCell(row.cells.length);
  cell.setAttribute('bgcolor','#cccccc');
  cell.setAttribute('width','50');
  cell.setAttribute('height','50');
  cell.setAttribute('align','center');
  cell.setAttribute('valign','center');
  var image = getimage(file,rank,state);
  if (image)
     {var widget = document.createElement('img');
      widget.setAttribute('width','40');
      widget.setAttribute('height','40');
      widget.setAttribute('src',image);
      cell.appendChild(widget)}
     else {cell.innerHTML = '&nbsp;'};
  return true}

function getimage (file,rank,state)
 {var color = compfindx('Piece',seq('cell',file,rank,'Piece'),state,library);
  if (color==='red') {return '../library/chinook/red.png'};
  if (color==='blue') {return '../library/chinook/blue.png'};
  return false}

//------------------------------------------------------------------------------
//------------------------------------------------------------------------------
//------------------------------------------------------------------------------

%%% metadata

role(red)
role(blue)

base(cell(F,R,red)) :- isaodd(F,R)
base(cell(F,R,blue)) :- isaeven(F,R)
base(cell(F,R,b)) :- isaodd(F,R)
base(cell(F,R,b)) :- isaeven(F,R)
base(score(W,0)) :- role(W)
base(score(W,N)) :- role(W) & scoreplus(M,N)
base(control(W)) :- role(W)
base(step(1))
base(step(N)) :- succ(M,N)

action(move(U,V,X,Y)) :- isaodd(U,V) & forward(U,V,X,Y)
action(move(X,Y,U,V)) :- isaeven(U,V) & forward(U,V,X,Y)
action(jump(U,V,C,D,X,Y)) :- isaodd(U,V) & jumpable(U,V,C,D,X,Y)
action(jump(X,Y,C,D,U,V)) :- isaeven(U,V) & jumpable(U,V,C,D,X,Y)
action(update(red,U,V,X,Y)) :- isaodd(U,V) & forward(U,V,X,Y)
action(update(blue,X,Y,U,V)) :- isaeven(U,V) & forward(U,V,X,Y)
action(kerchunk)

%%% legal
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

legal(move(U,V,X,Y)) :-
  control(red) &
  cell(U,V,red) &
  forward(U,V,X,Y) &
  cell(X,Y,b)

legal(move(X,Y,U,V)) :-
  control(blue) &
  cell(X,Y,blue) &
  forward(U,V,X,Y) &
  cell(U,V,b)

legal(jump(U,V,C,D,X,Y)) :-
  control(red) &
  cell(U,V,red) &
  jumpable(U,V,C,D,X,Y) &
  cell(C,D,red) &
  cell(X,Y,b)

legal(jump(X,Y,C,D,U,V)) :-
  control(blue) &
  cell(X,Y,blue) &
  jumpable(U,V,C,D,X,Y) &
  cell(C,D,blue) &
  cell(U,V,b)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% operations
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

move(U,V,X,Y) :: control(W) ==>
  ~cell(U,V,W) & ~cell(X,Y,b) & cell(U,V,b) & cell(X,Y,W) & kerchunk & update(W,U,V,X,Y)

jump(U,V,C,D,X,Y) :: control(W) ==>
  ~cell(U,V,W) & ~cell(X,Y,b) & cell(U,V,b) & cell(X,Y,W) & kerchunk & update(W,U,V,X,Y)


update(W,U,V,X,Y) ::
  ~home(W,U,V) & home(W,X,Y) & score(W,M) & scoreplus(M,N)
  ==> ~score(W,M) & score(W,N)

update(W,U,V,X,Y) ::
  home(W,U,V) & ~home(W,X,Y) & score(W,N) & scoreplus(M,N)
  ==> ~score(W,N) & score(W,M)


kerchunk :: step(M) & succ(M,N) ==> ~step(M) & step(N)
kerchunk :: control(red) ==> ~control(red) & control(blue)
kerchunk :: control(blue) ==> ~control(blue) & control(red)

goal(blue,Score) :- score(blue,Score)

forward(U,V,X,Y) :- nextrank(V,Y) & nextfile(X,U)

jumpable(U,V,C,D,X,Y) :- nextrank(V,D) & nextrank(D,Y) & nextfile(U,C) & nextfile(C,X)
jumpable(U,V,C,D,X,Y) :- nextrank(V,D) & nextrank(D,Y) & nextfile(X,C) & nextfile(C,U)
