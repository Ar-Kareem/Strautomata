<head>

  <script type='text/javascript'>
//==============================================================================
// Game parameters
//==============================================================================

var manager = 'manager';
var player = 'human';

function doplayer ()
 {player = read(prompt("What is your player's identifier?"));
  document.getElementById('player').innerHTML = player;
  return true}

//==============================================================================
// human.js
//==============================================================================

indexing = false;
dataindexing = false;
ruleindexing = true;

var game = 'buttonsandlights';
var role = 'robot';
var startclock = 10;
var playclock = 10;

var library = [];
var roles = [];
var state = [];
var statelog = [];
var movelog = [];
var messageid = "0";

function initialize ()
 {//document.addEventListener('keydown',handlekey);
  window.addEventListener("storage",handlestorage,false); console.log('listening');
  definerules(library,readdata(document.getElementById('library').textContent));
  roles = findroles(library);
  state = findinits(library);
  statelog = [state];
  movelog = [];
  movenum = 0;
  showstate(state);
  showactions(state);
  showhistory(movelog,state);
  return true}

//==============================================================================

function showstate (state)
 {var stateholder = document.getElementById('stateholder');
  var n = stateholder.childNodes.length;
  for (var i=0; i<n; i++) {stateholder.removeChild(stateholder.childNodes[0])};
  stateholder.appendChild(rendersituation(state));
  return true}

function rendersituation (state)
 {return renderstate(state)}

function renderstate (state)	
 {var widget = document.createElement('textarea');
  widget.setAttribute('rows','12');
  widget.setAttribute('cols','40');
  widget.setAttribute('style','font-family:courier');
  widget.setAttribute('disabled',true);
  widget.value = grindem(state);
  return widget}

//==============================================================================

function showactions (state)
 {var actionholder = document.getElementById('actionholder');
  var n = actionholder.childNodes.length;
  for (var i=0; i<n; i++) {actionholder.removeChild(actionholder.childNodes[0])};
  actionholder.appendChild(renderactions(state));
  return true}

function renderactions (state)
 {var widget = document.createElement('select');
  var option = document.createElement('option');
  option.value = 'error';
  option.text = '';
  widget.add(option);
  var actions = findlegals(state,library).sort();
  for (var i=0; i<actions.length; i++)
      {var option = document.createElement('option');
       var value = grind(actions[i]);
       option.value = value;
       option.text = value;
       widget.add(option)}
  if (findterminalp(state,library)) {widget.disabled = true}
     else {widget.disabled = false};
  widget.setAttribute('onchange','perform(read(this.value))');
  return widget}

//==============================================================================

function showhistory (moves,state)
 {var widget = document.getElementById('history');
  var n = widget.childNodes.length;
  for (var i=0; i<n; i++) {widget.removeChild(widget.childNodes[0])};
  widget.appendChild(renderhistory(moves,state));
  return true}

function renderhistory (moves,state)
 {var widget = document.createElement('table');
  widget.setAttribute('cellspacing',0);
  widget.setAttribute('cellpadding',3);
  widget.setAttribute('border',1);
  var row = widget.insertRow(0);
  var cell = row.insertCell(0);
  cell.innerHTML = 'Step';
  cell.setAttribute('width','120');
  cell.setAttribute('align','center');
  cell.setAttribute('style','font-weight:bold');
  cell.setAttribute('bgcolor','#dddddd');
  for (var j=0; j<roles.length; j++)
      {cell = row.insertCell(j+1);
       cell.innerHTML = roles[j];
       cell.setAttribute('width','120');
       cell.setAttribute('align','center');
       cell.setAttribute('style','font-weight:bold');
       cell.setAttribute('bgcolor','#dddddd')};

  for (var i=0; i<movenum; i++)
      {row = widget.insertRow(i+1);
       cell = row.insertCell(0);
       cell.setAttribute('align','center');
       cell.setAttribute('bgcolor','#dddddd');
       cell.innerHTML = i+1;
       for (var j=0; j<roles.length; j++)
           {cell = row.insertCell(j+1);
            cell.setAttribute('width','120');
            cell.setAttribute('align','center');
            if (findcontrol(statelog[i],library)===roles[j])
               {cell.innerHTML = grind(moves[i])}}};

  row = widget.insertRow(widget.rows.length);
  cell = row.insertCell(0);
  cell.innerHTML = 'Score';
  cell.setAttribute('style','font-weight:bold');
  cell.setAttribute('bgcolor','#dddddd');
  cell.setAttribute('align','center');
  for (var i=0; i<roles.length; i++)
      {cell = row.insertCell(i+1);
       cell.setAttribute('align','center');
       cell.setAttribute('bgcolor','#dddddd');
       cell.innerHTML = findreward(roles[i],state,library)};
  return widget}

//==============================================================================

function perform (action)
 {if (action==='error') {return false};
  //action performed only if in control; could let manager handle for now
  var response = grind(seq('message',messageid,player,manager,action));
  console.log(response);
  send(response);
  //endclock(timekeeper);
  return true}

function copy (obj)
 {return obj.slice(0)}

//==============================================================================

function handlestorage (ev)
 {//console.log(ev);
  console.log(ev.newValue);
  if (ev.key!==player) {return false};
  //var transcript = document.getElementById('transcript');
  //transcript.value = transcript.value + ev.newValue + "\n";
  var envelope = read(ev.newValue);
  messageid = envelope[1]
  var sender = envelope[2]
  var receiver = envelope[3]
  var message = envelope[4]
  if (sender!==manager) {return false};
  if (receiver!==player) {return false};
  console.log("Manager: " + grind(message));
  var answer = ggpeval(message);
  if (!answer) {console.log("Player: no response"); return false};
  var response = grind(seq('message',messageid,player,manager,answer));
  send(response);
  return true}

function send (str)
 {//var transcript = document.getElementById('transcript');
  //transcript.value = transcript.value + str + "\n";
  localStorage.manager = str;
  return true}

//==============================================================================

function ggpeval (msg)
 {if (symbolp(msg)) {return false};
  if (msg[0]==='ping') {return ping()};
  if (msg[0]==='start') {return start(msg[1],msg[2],msg[3],msg[4])};
  if (msg[0]==='play') {return play(msg[1])};
  if (msg[0]==='stop') {return stop(msg[1])};
  if (msg[0]==='abort') {return abort()};
  return false}

//==============================================================================

function ping ()
 {return 'ready'}

function start (r,rs,sc,pc)
 {role = r;
  //library = definemorerules([],rs.slice(1));
  //roles = findroles(library);
  //state = findinits(library);
  startclock = numberize(sc);
  playclock = numberize(pc);
  //timekeeper = beginclock(startclock);
  return 'ready'}

function play (move)
 {if (findcontrol(state,library)!==role) {return false};
  if (move===nil) {return false};
  statelog = statelog.slice(0,movenum+1);
  movelog = movelog.slice(0,movenum);
  movelog.push(move);
  state = simulate(move,state,library)
  statelog.push(state);
  movenum++;
  showstate(state);
  showactions(state);
  showhistory(movelog,state);
  //endclock(timekeeper);
  //timekeeper = beginclock(playclock);  return false}

function stop (move)
 {if (move!=='nil') {state = simulate(move,state,library)};
  movelog = movelog.slice(0,movenum);
  movelog.push(move);
  movenum++;
  showstate(state);
  showactions(state);
  showhistory(movelog,state);
  //endclock(timekeeper);
  return false}

function abort ()
 {//endclock(timekeeper);
  return false}

//------------------------------------------------------------------------------

function simulate (move,state,rules)
 {var deltas = compexpand(move,state,rules);
  var additions = [];
  var deletions = [];
  for (var i=0; i<deltas.length; i++)
      {if (symbolp(deltas[i])) {additions.push(deltas[i]); continue};
       if (deltas[i][0]==='not') {deletions.push(deltas[i][1]); continue};
       additions.push(deltas[i])};
  var newstate = [];
  for (i = 0; i<state.length; i++)
      {if (find(state[i],additions)) {continue};
       if (find(state[i],deletions)) {continue};
       newstate.push(state[i])};
  return newstate.concat(additions)}

//==============================================================================
// Timer//==============================================================================

function beginclock (n)
 {if (n===Infinity) {return false};
  document.getElementById('timer').value = n;
  return setInterval(updateclock,1000)}

function updateclock ()
 {var timer = document.getElementById('timer');
  var time = timer.value - 1;
  timer.value = time;
  if (time<=0) {endclock()};
  return true}

function endclock ()
 {clearclock();
  return true}

function clearclock ()
 {document.getElementById('timer').value = '';
  //clearInterval(timekeeper);
  return true}

//==============================================================================
// Basics
//==============================================================================

function findroles (rules)
 {return compfinds('R',seq('role','R'),seq(),rules)}

function findbases (rules)
 {return compfinds('P',seq('base','P'),seq(),rules)}

function findactions (rules)
 {return compfinds('A',seq('action','A'),seq(),rules)}

function findinits (rules)
 {return compfinds('P',seq('init','P'),seq(),rules)}

function findcontrol (facts,rules)
 {return compfindx('X',seq('control','X'),facts,rules)}

function findlegalp (move,facts,rules)
 {return compfindp(seq('legal',move),facts,rules)}

function findlegalx (facts,rules)
 {return compfindx('X',seq('legal','X'),facts,rules)}

function findlegals (facts,rules)
 {return compfinds('X',seq('legal','X'),facts,rules)}

function findreward (role,facts,rules)
 {var value = compfindx('R',seq('goal',role,'R'),facts,rules);
  if (value) {return value};
  return 0}

function findterminalp (facts,rules)
 {return compfindp('terminal',facts,rules)}

//==============================================================================
// End of Script
//==============================================================================
  </script>
  <script type='text/javascript'>
//==============================================================================
// Hex
//==============================================================================

function renderstate (state)
 {var step = compfindx('N',seq('step','N'),state,library);
  var role = compfindx('R',seq('control','R'),state,library);
  var table = document.createElement('table');
  table.setAttribute('border','0');
  var row = table.insertRow(0);
  var cell = row.insertCell(0);
  cell.setAttribute('align','center');
  cell.setAttribute('style','font-size:20px');
  cell.innerHTML = 'Step:  ' + step;
  row = table.insertRow(1);
  var cell = row.insertCell(0);
  var board = renderboard(state);
  cell.appendChild(board);
  row = table.insertRow(2);
  var cell = row.insertCell(0);
  cell.setAttribute('align','center');
  cell.setAttribute('style','font-size:20px');
  if (compfindp('terminal',state,library))
     {cell.innerHTML = 'Game over'}
     else {cell.innerHTML = 'Control:  ' + role};
  return table}

function renderboard (state)
 {var canvas = document.createElement('canvas');
  canvas.setAttribute('width','400px');
  canvas.setAttribute('height','340px');

  drawhex(180, 40,canvas);

  drawreddish(150, 60,canvas);
  drawgrey(210, 60,canvas);

  drawreddish(120, 80,canvas);
  drawhex(180, 80,canvas);
  drawgrey(240, 80,canvas);

  drawreddish( 90,100,canvas);
  drawhex(150,100,canvas);
  drawhex(210,100,canvas);
  drawgrey(270,100,canvas);

  drawreddish( 60,120,canvas);
  drawhex(120,120,canvas);
  drawhex(180,120,canvas);
  drawhex(240,120,canvas);
  drawgrey(300,120,canvas);

  drawreddish( 30,140,canvas);
  drawhex( 90,140,canvas);
  drawhex(150,140,canvas);
  drawhex(210,140,canvas);
  drawhex(270,140,canvas);
  drawgrey(330,140,canvas);

  drawhex(  0,160,canvas);
  drawhex(60,160,canvas);
  drawhex(120,160,canvas);
  drawhex(180,160,canvas);
  drawhex(240,160,canvas);
  drawhex(300,160,canvas);
  drawhex(360,160,canvas);

  drawgrey( 30,180,canvas);
  drawhex( 90,180,canvas);
  drawhex(150,180,canvas);
  drawhex(210,180,canvas);
  drawhex(270,180,canvas);
  drawreddish(330,180,canvas);

  drawgrey( 60,200,canvas);
  drawhex(120,200,canvas);
  drawhex(180,200,canvas);
  drawhex(240,200,canvas);
  drawreddish(300,200,canvas);

  drawgrey( 90,220,canvas);
  drawhex(150,220,canvas);
  drawhex(210,220,canvas);
  drawreddish(270,220,canvas);

  drawgrey(120,240,canvas);
  drawhex(180,240,canvas);
  drawreddish(240,240,canvas);

  drawgrey(150,260,canvas);
  drawreddish(210,260,canvas);

  drawhex(180,280,canvas);

  for (var i=0; i<state.length; i++)
      {if (state[i][0]=='cell')
          {var x = xpos(state[i][1],state[i][2]);
           var y = ypos(state[i][1],state[i][2]);
           if (state[i][3]=='red') {drawred(x,y,canvas)};
           if (state[i][3]=='black') {drawblack(x,y,canvas)}}};

  return canvas}

function xpos (m,n)
 {return xm(m)+xn(n)}

function ypos (m,n)
 {return 160+ym(m)-yn(n)}

function xm (m)
 {if (m=='a') {return 0};
  if (m=='b') {return 30};
  if (m=='c') {return 60};
  if (m=='d') {return 90};
  if (m=='e') {return 120};
  if (m=='f') {return 150};
  if (m=='g') {return 180};
  if (m=='h') {return 210};
  if (m=='i') {return 240};
  if (m=='j') {return 270};
  if (m=='k') {return 300};
  return 330}

function ym (m)
 {if (m=='a') {return 0};
  if (m=='b') {return 20};
  if (m=='c') {return 40};
  if (m=='d') {return 60};
  if (m=='e') {return 80};
  if (m=='f') {return 100};
  if (m=='g') {return 120};
  if (m=='h') {return 140};
  if (m=='i') {return 160};
  if (m=='j') {return 180};
  if (m=='k') {return 200};
  return 330}

function yn (n)
 {if (n=='1') {return 0};
  if (n=='2') {return 20};
  if (n=='3') {return 40};
  if (n=='4') {return 60};
  if (n=='5') {return 80};
  if (n=='6') {return 100};
  if (n=='7') {return 120};
  if (n=='8') {return 140};
  if (n=='9') {return 160};
  if (n=='10') {return 180};
  if (n=='11') {return 200};
  return 330}

function xn (n)
 {if (n=='1') {return 0};
  if (n=='2') {return 30};
  if (n=='3') {return 60};
  if (n=='4') {return 90};
  if (n=='5') {return 120};
  if (n=='6') {return 150};
  if (n=='7') {return 180};
  if (n=='8') {return 210};
  if (n=='9') {return 240};
  if (n=='10') {return 270};
  if (n=='11') {return 300};
  return 330}

//------------------------------------------------------------------------------
// Drawing subroutines
//------------------------------------------------------------------------------

function drawreddish (x,y,w)
 {var ctx = w.getContext('2d');
  ctx.beginPath();
  ctx.lineWidth=1;
  ctx.moveTo(x+10,y+ 0);
  ctx.lineTo(x+30,y+ 0);
  ctx.lineTo(x+40,y+20);
  ctx.lineTo(x+30,y+40);
  ctx.lineTo(x+10,y+40);
  ctx.lineTo( x+0,y+20);
  ctx.closePath();
  ctx.fillStyle = "#fff0f0";
  ctx.fill();
  ctx.stroke()}

function drawgrey (x,y,w)
 {var ctx = w.getContext('2d');
  ctx.beginPath();
  ctx.lineWidth=1;
  ctx.moveTo(x+10,y+ 0);
  ctx.lineTo(x+30,y+ 0);
  ctx.lineTo(x+40,y+20);
  ctx.lineTo(x+30,y+40);
  ctx.lineTo(x+10,y+40);
  ctx.lineTo( x+0,y+20);
  ctx.closePath();
  ctx.fillStyle = "#dddddd";
  ctx.fill();
  ctx.stroke()}

function drawhex (x,y,canvas)
 {drawline(x+ 0,y+20,x+10,y+ 0,canvas);
  drawline(x+10,y+ 0,x+30,y+ 0,canvas);
  drawline(x+30,y+ 0,x+40,y+20,canvas);
  drawline(x+40,y+20,x+30,y+40,canvas);
  drawline(x+30,y+40,x+10,y+40,canvas);
  drawline(x+10,y+40, x+0,y+20,canvas)}

function drawred (x,y,w)
 {var ctx = w.getContext('2d');
  ctx.beginPath();
  ctx.lineWidth=2;
  ctx.arc(x+20,y+20,12,0,2*Math.PI,false);
  ctx.stroke();
  ctx.fillStyle = "#ff8888";
  ctx.fill();}

function drawblack (x,y,w)
 {var ctx = w.getContext('2d');
  ctx.beginPath();
  ctx.lineWidth=2;
  ctx.arc(x+20,y+20,12,0,2*Math.PI,false);
  ctx.stroke();
  ctx.fillStyle = "#888888";
  ctx.fill();}

function drawblank (x,y,w)
 {var ctx = w.getContext('2d');
  ctx.beginPath();
  ctx.lineWidth=2;
  ctx.arc(x+20,y+20,12,0,2*Math.PI,false);
  ctx.stroke();
  ctx.fillStyle = "#ffffff";
  ctx.fill();}

function drawline(u,v,x,y,w)
 {var ctx = w.getContext('2d');
  ctx.beginPath();
  ctx.lineWidth=1;
  ctx.moveTo(u,v);
  ctx.lineTo(x,y);
  ctx.stroke()}

function drawnode (node,x,y,canvas)
 {var mark = compfindx('X',seq('cell',node,'X'),state,library);
  if (mark=='red') {drawred(x,y,canvas); return true};
  if (mark=='black') {drawblack(x,y,canvas); return true};
  drawblank(x,y,canvas);
  return true}

function drawtext (text,x,y,w)
 {var ctx = w.getContext('2d');
  ctx.fillStyle = "#000000";
  ctx.font="italic 14px Times"
  ctx.fillText(text,x+12,y+18);
  return true}

function drawscore (text,x,y,w)
 {var ctx = w.getContext('2d');
  ctx.fillStyle = "#000000";
  ctx.font="28px Times"
  ctx.fillText(text,x+12,y+18);
  return true}

  </script>

<textarea id='library' type='text/hrf' style='display:none'>
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% hex7x7
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% metadata
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

role(red)
role(black)

base(cell(M,N,R)) :- row(M) & col(N) & role(R)
base(connected(K,M,N)) :- succ(K,L) & row(M) & col(N)
base(owner(K,R)) :- succ(K,L) & role(R)
base(step(K)) :- succ(K,L)
base(control(R)) :- role(R)

action(place(M,N)) :- row(M) & col(N)
action(transfer(M,N)) :- row(M) & col(N)
action(cleanup(J)) :- succ(J,K)
action(update(M,N)) :- row(M) & col(N)
action(kerchunk)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% init
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

init(step(1))
init(control(red))

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% legal
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

legal(place(M,N)) :- row(M) & col(N) & ~cell(M,N,red) & ~cell(M,N,black)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% operations
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

place(M,N) :: control(R) & step(K) ==> cell(M,N,R) & owner(K,R) & connected(K,M,N)
place(M,N) :: control(R) & adjacent(M,N,P,Q) & cell(P,Q,R) ==> transfer(P,Q)
place(M,N) :: kerchunk

transfer(P,Q) :: connected(J,P,Q) ==> cleanup(J)
cleanup(J) :: connected(J,M,N) ==> ~connected(J,M,N) & update(M,N)
update(M,N) :: step(K) ==> connected(K,M,N)

kerchunk :: step(M) & succ(M,N) ==> ~step(M) & step(N)
kerchunk :: control(red) ==> ~control(red) & control(black)
kerchunk :: control(black) ==> ~control(black) & control(red)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% goal
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

goal(red,100) :- redpath
goal(red,0) :- ~redpath
goal(black,100) :- blackpath
goal(black,0) :- ~blackpath

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% terminal
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

terminal :- redpath
terminal :- blackpath

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% Views
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

adjacent(J,K,J,N) :- nextcol(K,N) & row(J)
adjacent(J,K,J,N) :- nextcol(N,K) & row(J)
adjacent(J,K,M,K) :- nextrow(J,M) & col(K)
adjacent(J,K,M,K) :- nextrow(M,J) & col(K)
adjacent(J,K,M,N) :- nextrow(M,J) & nextcol(K,N)
adjacent(J,K,M,N) :- nextrow(J,M) & nextcol(N,K)

redpath :- connected(K,a,I) & connected(K,g,J) & owner(K,red)
blackpath :- connected(K,I,1) & connected(K,J,7) & owner(K,black)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% Facts
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

row(a)
row(b)
row(c)
row(d)
row(e)
row(f)
row(g)

col(1)
col(2)
col(3)
col(4)
col(5)
col(6)
col(7)

nextrow(a,b)
nextrow(b,c)
nextrow(c,d)
nextrow(d,e)
nextrow(e,f)
nextrow(f,g)

nextcol(1,2)
nextcol(2,3)
nextcol(3,4)
nextcol(4,5)
nextcol(5,6)
nextcol(6,7)

succ(1,2)
succ(2,3)
