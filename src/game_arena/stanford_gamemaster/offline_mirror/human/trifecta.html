  <script type='text/javascript'>
//==============================================================================
// Game parameters
//==============================================================================

var manager = 'manager';
var player = 'human';

function doplayer ()
 {player = read(prompt("What is your player's identifier?"));
  document.getElementById('player').innerHTML = player;
  return true}

//==============================================================================
// human.js
//==============================================================================

indexing = false;
dataindexing = false;
ruleindexing = true;

var game = 'buttonsandlights';
var role = 'robot';
var startclock = 10;
var playclock = 10;

var library = [];
var roles = [];
var state = [];
var statelog = [];
var movelog = [];
var messageid = "0";

function initialize ()
 {//document.addEventListener('keydown',handlekey);
  window.addEventListener("storage",handlestorage,false); console.log('listening');
  definerules(library,readdata(document.getElementById('library').textContent));
  roles = findroles(library);
  state = findinits(library);
  statelog = [state];
  movelog = [];
  movenum = 0;
  showstate(state);
  showactions(state);
  showhistory(movelog,state);
  return true}

//==============================================================================

function showstate (state)
 {var stateholder = document.getElementById('stateholder');
  var n = stateholder.childNodes.length;
  for (var i=0; i<n; i++) {stateholder.removeChild(stateholder.childNodes[0])};
  stateholder.appendChild(rendersituation(state));
  return true}

function rendersituation (state)
 {return renderstate(state)}

function renderstate (state)	
 {var widget = document.createElement('textarea');
  widget.setAttribute('rows','12');
  widget.setAttribute('cols','40');
  widget.setAttribute('style','font-family:courier');
  widget.setAttribute('disabled',true);
  widget.value = grindem(state);
  return widget}

//==============================================================================

function showactions (state)
 {var actionholder = document.getElementById('actionholder');
  var n = actionholder.childNodes.length;
  for (var i=0; i<n; i++) {actionholder.removeChild(actionholder.childNodes[0])};
  actionholder.appendChild(renderactions(state));
  return true}

function renderactions (state)
 {var widget = document.createElement('select');
  var option = document.createElement('option');
  option.value = 'error';
  option.text = '';
  widget.add(option);
  var actions = findlegals(state,library).sort();
  for (var i=0; i<actions.length; i++)
      {var option = document.createElement('option');
       var value = grind(actions[i]);
       option.value = value;
       option.text = value;
       widget.add(option)}
  if (findterminalp(state,library)) {widget.disabled = true}
     else {widget.disabled = false};
  widget.setAttribute('onchange','perform(read(this.value))');
  return widget}

//==============================================================================

function showhistory (moves,state)
 {var widget = document.getElementById('history');
  var n = widget.childNodes.length;
  for (var i=0; i<n; i++) {widget.removeChild(widget.childNodes[0])};
  widget.appendChild(renderhistory(moves,state));
  return true}

function renderhistory (moves,state)
 {var widget = document.createElement('table');
  widget.setAttribute('cellspacing',0);
  widget.setAttribute('cellpadding',3);
  widget.setAttribute('border',1);
  var row = widget.insertRow(0);
  var cell = row.insertCell(0);
  cell.innerHTML = 'Step';
  cell.setAttribute('width','120');
  cell.setAttribute('align','center');
  cell.setAttribute('style','font-weight:bold');
  cell.setAttribute('bgcolor','#dddddd');
  for (var j=0; j<roles.length; j++)
      {cell = row.insertCell(j+1);
       cell.innerHTML = roles[j];
       cell.setAttribute('width','120');
       cell.setAttribute('align','center');
       cell.setAttribute('style','font-weight:bold');
       cell.setAttribute('bgcolor','#dddddd')};

  for (var i=0; i<movenum; i++)
      {row = widget.insertRow(i+1);
       cell = row.insertCell(0);
       cell.setAttribute('align','center');
       cell.setAttribute('bgcolor','#dddddd');
       cell.innerHTML = i+1;
       for (var j=0; j<roles.length; j++)
           {cell = row.insertCell(j+1);
            cell.setAttribute('width','120');
            cell.setAttribute('align','center');
            if (findcontrol(statelog[i],library)===roles[j])
               {cell.innerHTML = grind(moves[i])}}};

  row = widget.insertRow(widget.rows.length);
  cell = row.insertCell(0);
  cell.innerHTML = 'Score';
  cell.setAttribute('style','font-weight:bold');
  cell.setAttribute('bgcolor','#dddddd');
  cell.setAttribute('align','center');
  for (var i=0; i<roles.length; i++)
      {cell = row.insertCell(i+1);
       cell.setAttribute('align','center');
       cell.setAttribute('bgcolor','#dddddd');
       cell.innerHTML = findreward(roles[i],state,library)};
  return widget}

//==============================================================================

function perform (action)
 {if (action==='error') {return false};
  //action performed only if in control; could let manager handle for now
  var response = grind(seq('message',messageid,player,manager,action));
  console.log(response);
  send(response);
  //endclock(timekeeper);
  return true}

function copy (obj)
 {return obj.slice(0)}

//==============================================================================

function handlestorage (ev)
 {//console.log(ev);
  console.log(ev.newValue);
  if (ev.key!==player) {return false};
  //var transcript = document.getElementById('transcript');
  //transcript.value = transcript.value + ev.newValue + "\n";
  var envelope = read(ev.newValue);
  messageid = envelope[1]
  var sender = envelope[2]
  var receiver = envelope[3]
  var message = envelope[4]
  if (sender!==manager) {return false};
  if (receiver!==player) {return false};
  console.log("Manager: " + grind(message));
  var answer = ggpeval(message);
  if (!answer) {console.log("Player: no response"); return false};
  var response = grind(seq('message',messageid,player,manager,answer));
  send(response);
  return true}

function send (str)
 {//var transcript = document.getElementById('transcript');
  //transcript.value = transcript.value + str + "\n";
  localStorage.manager = str;
  return true}

//==============================================================================

function ggpeval (msg)
 {if (symbolp(msg)) {return false};
  if (msg[0]==='ping') {return ping()};
  if (msg[0]==='start') {return start(msg[1],msg[2],msg[3],msg[4])};
  if (msg[0]==='play') {return play(msg[1])};
  if (msg[0]==='stop') {return stop(msg[1])};
  if (msg[0]==='abort') {return abort()};
  return false}

//==============================================================================

function ping ()
 {return 'ready'}

function start (r,rs,sc,pc)
 {role = r;
  //library = definemorerules([],rs.slice(1));
  //roles = findroles(library);
  //state = findinits(library);
  startclock = numberize(sc);
  playclock = numberize(pc);
  //timekeeper = beginclock(startclock);
  return 'ready'}

function play (move)
 {if (findcontrol(state,library)!==role) {return false};
  if (move===nil) {return false};
  statelog = statelog.slice(0,movenum+1);
  movelog = movelog.slice(0,movenum);
  movelog.push(move);
  state = simulate(move,state,library)
  statelog.push(state);
  movenum++;
  showstate(state);
  showactions(state);
  showhistory(movelog,state);
  //endclock(timekeeper);
  //timekeeper = beginclock(playclock);  return false}

function stop (move)
 {if (move!=='nil') {state = simulate(move,state,library)};
  movelog = movelog.slice(0,movenum);
  movelog.push(move);
  movenum++;
  showstate(state);
  showactions(state);
  showhistory(movelog,state);
  //endclock(timekeeper);
  return false}

function abort ()
 {//endclock(timekeeper);
  return false}

//------------------------------------------------------------------------------

function simulate (move,state,rules)
 {var deltas = compexpand(move,state,rules);
  var additions = [];
  var deletions = [];
  for (var i=0; i<deltas.length; i++)
      {if (symbolp(deltas[i])) {additions.push(deltas[i]); continue};
       if (deltas[i][0]==='not') {deletions.push(deltas[i][1]); continue};
       additions.push(deltas[i])};
  var newstate = [];
  for (i = 0; i<state.length; i++)
      {if (find(state[i],additions)) {continue};
       if (find(state[i],deletions)) {continue};
       newstate.push(state[i])};
  return newstate.concat(additions)}

//==============================================================================
// Timer//==============================================================================

function beginclock (n)
 {if (n===Infinity) {return false};
  document.getElementById('timer').value = n;
  return setInterval(updateclock,1000)}

function updateclock ()
 {var timer = document.getElementById('timer');
  var time = timer.value - 1;
  timer.value = time;
  if (time<=0) {endclock()};
  return true}

function endclock ()
 {clearclock();
  return true}

function clearclock ()
 {document.getElementById('timer').value = '';
  //clearInterval(timekeeper);
  return true}

//==============================================================================
// Basics
//==============================================================================

function findroles (rules)
 {return compfinds('R',seq('role','R'),seq(),rules)}

function findbases (rules)
 {return compfinds('P',seq('base','P'),seq(),rules)}

function findactions (rules)
 {return compfinds('A',seq('action','A'),seq(),rules)}

function findinits (rules)
 {return compfinds('P',seq('init','P'),seq(),rules)}

function findcontrol (facts,rules)
 {return compfindx('X',seq('control','X'),facts,rules)}

function findlegalp (move,facts,rules)
 {return compfindp(seq('legal',move),facts,rules)}

function findlegalx (facts,rules)
 {return compfindx('X',seq('legal','X'),facts,rules)}

function findlegals (facts,rules)
 {return compfinds('X',seq('legal','X'),facts,rules)}

function findreward (role,facts,rules)
 {var value = compfindx('R',seq('goal',role,'R'),facts,rules);
  if (value) {return value};
  return 0}

function findterminalp (facts,rules)
 {return compfindp('terminal',facts,rules)}

//==============================================================================
// End of Script
//==============================================================================
  </script>
  <script type='text/javascript'>
//------------------------------------------------------------------------------
// tictactoe
//------------------------------------------------------------------------------
init();
function renderstate (state)
{
	var table = document.createElement('table');
	table.setAttribute('cellspacing','0');
	var names = {'b': "Deck", "x": "White", "o": "Black"};
	makerow(table,'b',state,names);
	makerow(table,'x',state,names);
	makerow(table,'o',state,names);
	return table;
}

function getCards(type,state)
{
	return compfinds(seq('X','Y'),seq('cell','X','Y', type),state,seq());
}

function mapRC(rc)
{
	return (JSON.parse(rc[0]) - 1) * 3 + JSON.parse(rc[1]);
}

function makerow (table,player,state,names)
{
	var row = table.insertRow();
	makecell(row, names[player]);
	var _cards = getCards(player,state);//.join(',');
	var t = document.createElement('table');
	var r = t.insertRow();
	if (!_cards.length)
	{
		var ct = document.createElement('table');
		var ctr1 = ct.insertRow();
		makecell(ctr1,"&nbsp;",75,120);
		makecell(r,ct.outerHTML);
	}
	else
	{
		for (var i = 0; i < _cards.length; i++)
		{
			var c  = renderCard(mapRC(_cards[i]), 70);
			var ct = document.createElement('table');
			var ctr1 = ct.insertRow();
			makecell(ctr1,c.outerHTML,75,75);
			var ctr2 = ct.insertRow();
			makecell(ctr2,_cards[i].join(","));
			makecell(r,ct.outerHTML);
		}
	}
	makecell(row,t.outerHTML);
	//makecell(row, r);
  	return row;
}

function makecell (row,html,w,h)
{
	var cell = row.insertCell();
	if (typeof w != 'undefined')
	{
		cell.setAttribute('width',w);
	}
	if (typeof h != 'undefined')
	{
		cell.setAttribute('height',h);
	}
	cell.setAttribute('align','center');
	cell.setAttribute('valign','center');
	cell.setAttribute('style','font-family:HelveticaNeue-Light;font-size:12pt');
	cell.innerHTML = html;
	return cell;
}

/*CARD GENERATION PROCESS*/
function shuffle(array)
{
	var choice = [], output = [];
	for (var i = 0; i < array.length; i++)
	{
		choice.push(i);
	}
	for (var i = 0; i < array.length; i++)
	{
		var chosen = Math.floor(Math.random() * choice.length);
		output.push(array[choice[chosen]]), choice.splice(chosen, 1); 
	}
	return output;
}

function init()
{
	var concept = {};
	concept['rows'] = [[1,2,3], [4,5,6], [7,8,9]], concept['cols'] = [[1,4,7], [2,5,8], [3,6,9]], concept['dia1'] = [[1,5,9]], concept['dia2'] = [[3,5,7]];
	var resDia1 = [], resDia2 = [];
	for (var i = 1; i < 10; i++)
	{
		if (concept['dia1'][0].indexOf(i) == -1)
		{
			resDia1.push(i);
		}
		if (concept['dia2'][0].indexOf(i) == -1)
		{
			resDia2.push(i);
		}
	}
	resDia1 = shuffle(resDia1), resDia2 = shuffle(resDia2);
	for (var i = 0; i < 3; i++)
	{
		concept['dia1'].push([resDia1[i], resDia1[i + 3]]);
		concept['dia2'].push([resDia2[i], resDia2[i + 3]]);
	}
	var props = shuffle(['background', 'foreground', 'shape', 'number']), concepts = Object.keys(concept), value = {};
	palette = ['#F9A727', '#DD3C26', '#5138BD', '#F4F4F4', '#000000', '#27AE60'];
	value['background'] = shuffle(palette);
	value['foreground'] = shuffle(shuffle(palette));
	value['shape'] = shuffle(['&hearts;', '&diams;', '&clubs;', '&spades;']);
	value['number'] = shuffle([1, 2, 3, 4, 5]);
	_card = {};
	for (var i = 1; i <= 9; i++)
	{
		_card[i] = {};
	}
	for (var i = 0; i < concepts.length; i++)
	{
		var prop = props[i], c = concept[concepts[i]];
		for (var j = 0; j < c.length; j++)
		{
			var d = c[j];
			if ('foreground' in _card[d[0]] && prop == 'background')
			{
				var l = -1;
				var flag;
				do
				{
					l++; flag = false;
					for(var w = 0; w < d.length; w++)
					{
						if (value[prop][l] == _card[d[w]]['foreground'])
						{
							flag = true;
						}
					}
				} while (flag);
				for (var k = 0; k < d.length; k++)
				{
					var x = d[k];
					_card[x][prop] = value[prop][l];
				}
				value[prop].splice(l, 1);
			}
			else if ('background' in _card[d[0]] && prop == 'foreground')
			{
				var l = -1;
				var flag;
				do
				{
					l++; flag = false;
					for (var w = 0; w < d.length; w++)
					{
						if (value[prop][l] == _card[d[w]]['background'])
						{
							flag = true;
						}
					}
				} while (flag);
				for (var k = 0; k < d.length; k++)
				{
					var x = d[k];
					_card[x][prop] = value[prop][l];
				}
				value[prop].splice(l, 1);
			}
			else
			{
				for (var k = 0; k < d.length; k++)
				{
					var x = d[k];
					_card[x][prop] = value[prop][0];
				}
				value[prop].splice(0, 1);
			}
		}
	}
}

var gradient = {};
gradient['#5138BD'] = '#6F56DB';
gradient['#DD3C26'] = LightenDarkenColor('#DD3C26', -50);
gradient['#000000'] = '#444444'
gradient['#F4F4F4'] = '#CCCCCC';
gradient['#F9A727'] = '#EB8327';
gradient['#27AE60'] = '#40C779';
function LightenDarkenColor(col, amt) 
{
	var usePound = false;
  	if (col[0] == "#") 
	{
        col = col.slice(1);
        usePound = true;
    }
 	var num = parseInt(col,16), r = (num >> 16) + amt;
 
    if (r > 255)
	{
		r = 255;
    }
	else if (r < 0)
	{
		r = 0;
 	}
    var b = ((num >> 8) & 0x00FF) + amt;
    if (b > 255)
	{
		b = 255;
    }
	else if (b < 0) 
	{
		b = 0;
 	}
    var g = (num & 0x0000FF) + amt;
    if (g > 255)
	{
		g = 255;
    }
	else if (g < 0) 
	{
		g = 0;
 	}
    return (usePound?"#":"") + (g | (b << 8) | (r << 16)).toString(16);
}

function getCssValuePrefix(name, value) 
{
    var prefixes = ['', '-o-', '-ms-', '-moz-', '-webkit-'];
    var dom = document.createElement('div');
    for (var i = 0; i < prefixes.length; i++) 
	{
        dom.style[name] = prefixes[i] + value;
        if (dom.style[name]) 
		{
            return prefixes[i];
        }
        dom.style[name] = '';
    }
}

function renderCard(id, width)
{
	if (!id)
	{
		return;
	}
	sym = _card[id].shape, bkg = _card[id].background, fg = _card[id].foreground, n = _card[id].number;
	var div = [];
	var elem = document.createElement("div");
	var w = width, h = 1.4* w, sh = h / 3, sw = w / 2;
	//elem.style.width = w;
	//elem.style.height = h;
	var c3 = n % 2 ? sym : "&nbsp;", c1 = n > 1 ? sym : "&nbsp;", c2 = n > 3 ? sym : "&nbsp;"; 
	var gP = getCssValuePrefix('backgroundImage', 'linear-gradient(left, #fff, #fff)');
	var table = '<table class="card" cellspacing="0" width="' + w + '" height="' + h + '" cellpadding="0" style="text-align:center;font-size:' + (sh * 0.65) + 'px;color:' + fg + ';font-family:HelveticaNeue-Light;border-radius:5px;background:' + gP + "linear-gradient(" + ["left", gradient[bkg], bkg, gradient[bkg]].join(', ') + ');"><tr><td>' + c1 + '</td><td>' + c2 + '</td></tr><tr><td valign="middle" colspan="2">' + c3 + '</td></tr><tr><td>' + c2 + '</td><td>' + c1 + '</td></tr></table>';
	elem.innerHTML = table;
	return elem.firstChild  ;
}

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% tictactoe
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% metadata
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

role(x)
role(o)

base(cell(M,N,x)) :- index(M) & index(N)
base(cell(M,N,o)) :- index(M) & index(N)
base(cell(M,N,b)) :- index(M) & index(N)
base(control(R))  :- role(R)

action(mark(M,N)) :- index(M) & index(N)

index(1)
index(2)
index(3)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% init
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

init(cell(M,N,b)) :- index(M) & index(N)
init(control(x))

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% legal
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

legal(mark(M,N)) :- cell(M,N,b)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% operations
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

mark(M,N) :: control(R)  ==> cell(M,N,R) & ~cell(M,N,b)
mark(M,N) :: control(x) ==> ~control(x) & control(o)
mark(M,N) :: control(o) ==> ~control(o) & control(x)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% goal
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

goal(x,100) :- line(x) & ~line(o)
goal(x,50) :- line(x) & line(o)
goal(x,50) :- ~line(x) & ~line(o)
goal(x,0) :- ~line(x) & line(o)
goal(o,100) :- ~line(x) & line(o)
goal(o,50) :- line(x) & line(o)
goal(o,50) :- ~line(x) & ~line(o)
goal(o,0) :- line(x) & ~line(o)

row(M,X) :- cell(M,1,X) & cell(M,2,X) & cell(M,3,X)
col(N,X) :- cell(1,N,X) & cell(2,N,X) & cell(3,N,X)
diag(X) :- cell(1,1,X) & cell(2,2,X) & cell(3,3,X)
diag(X) :- cell(1,3,X) & cell(2,2,X) & cell(3,1,X)

line(X) :- row(M,X)
line(X) :- col(N,X)
line(X) :- diag(X)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% terminal
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

terminal :- line(x)
terminal :- line(o)
terminal :- ~open

open :- cell(M,N,b)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
