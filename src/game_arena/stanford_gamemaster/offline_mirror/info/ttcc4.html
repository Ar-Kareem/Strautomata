<table width='100%' cellpadding='4' cellspacing='0' border='1'><tr height='40' bgcolor='#e4eaea'><th colspan='2'>ttcc4</th></tr><tr><td width='100' align='center'>Description</td><td><textarea style='width:100%' rows='5' disabled>
TTCC4 is an amalgam of Chess, Checkers, Tic Tac Toe, and Connect Four.  Each player has a pawn, a checker king, and a knight in home positions.  On each turn, the active player can move one of its pieces or drop a disk in one of the central chutes on the board.  Captures are permitted according to the rules of the games from which the pieces are drawn.  The objective of the game is to make three in a row, column, or diagonal in the middle 9 squares of the board.

</textarea></td></tr><tr><td align='center'>Rulesheet</td><td><textarea style='font-family:courier;width:100%' rows='20' disabled>%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% ttcc4
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% metadata
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

role(white)
role(black)

base(cell(X,Y,Piece)) :- start(Piece,X,Y)
base(cell(X,Y,Piece)) :- onboard(X,Y) & piece(Piece,pawn,Color)
base(cell(X,Y,Piece)) :- onboard(X,Y) & piece(Piece,knight,Color)
base(cell(X,Y,Piece)) :- onboard(X,Y) & oddsquare(X,Y) & piece(Piece,checker,Color)
base(cell(X,Y,Piece)) :- index(X) & chute(Y) & piece(Piece,disk,Color)
base(step(1))
base(step(N)) :- succ(M,N)
base(control(Player)) :- role(Player)

action(drop(Y)) :- role(Player) & chute(Y)

action(pawnmove(X1,Y1,X2,Y2)) :-
  piece(Piece,pawn,Player) &
  active(Piece,X1,Y1) &
  orthogonal(X1,Y1,X2,Y2) &
  onboard(X2,Y2)

action(pawnmove(X1,Y1,X2,Y2)) :-
  piece(Piece,pawn,Player) &
  active(Piece,X1,Y1) &
  diagonal(X1,Y1,X2,Y2) &
  onboard(X2,Y2)

action(knightmove(X1,Y1,X2,Y2)) :-
  piece(Piece,knight,Player) &
  active(Piece,X1,Y1) &
  ell(X1,Y1,X2,Y2) &
  onboard(X2,Y2)

action(checkermove(X1,Y1,X2,Y2)) :-
  piece(Piece,checker,Player) &
  active(Piece,X1,Y1) &
  diagonal(X1,Y1,X2,Y2) &
  onboard(X2,Y2) &
  oddsquare(X2,Y2)

action(jump(X1,Y1,X2,Y2,X3,Y3)) :-
  piece(Piece,checker,Player) &
  active(Piece,X1,Y1) &
  jumpable(X1,Y1,X2,Y2,X3,Y3) &
  onboard(X3,Y3) &
  oddsquare(X2,Y2)

action(noop) :- role(Player)

action(kerchunk)

active(Piece,X,Y) :- start(Piece,X,Y)
active(Piece,X,Y) :- piece(Piece,Type,Role) & onboard(X,Y)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% init
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

init(cell(3,1,whiteknight))
init(cell(4,1,whitechecker))
init(cell(5,1,whitepawn))
init(cell(3,7,blackpawn))
init(cell(4,7,blackchecker))
init(cell(5,7,blackknight))
init(step(1))
init(control(white))

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% legal
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

legal(drop(N)) :- chute(N) & emptycell(1,N)

legal(pawnmove(M1,N1,M2,N2)) :-
  control(Role) &
  cell(M1,N1,Piece) & 
  piece(Piece,pawn,Role) &
  orthogonal(M1,N1,M2,N2) &
  onboard(M2,N2) &
  emptycell(M2,N2)

legal(knightmove(X1,Y1,X2,Y2)) :-
  control(Role) &
  cell(X1,Y1,Piece) &
  piece(Piece,knight,Role) &
  ell(X1,Y1,X2,Y2) &
  onboard(X2,Y2) &
  emptycell(X2,Y2)

legal(knightmove(X1,Y1,X2,Y2)) :-
  control(Role1) &
  cell(X1,Y1,Piece) &
  piece(Piece,knight,Role1) &
  ell(X1,Y1,X2,Y2) &
  onboard(X2,Y2) &
  cell(X2,Y2,Piece2) &
  piece(Piece2,Type,Role2) &
  distinct(Role1,Role2)

legal(checkermove(X1,Y1,X2,Y2)) :-
  control(Role) &
  cell(X1,Y1,Piece) &
  piece(Piece,checker,Role) &
  diagonal(X1,Y1,X2,Y2) &
  onboard(X2,Y2) &
  emptycell(X2,Y2)

legal(jump(X1,Y1,X2,Y2,X3,Y3)) :-
  control(Role1) &
  cell(X1,Y1,Piece) &
  piece(Piece,checker,Role1) &
  jumpable(X1,Y1,X2,Y2,X3,Y3) &
  cell(X2,Y2,Piece2) &
  piece(Piece2,Ignore,Role2) &
  distinct(Role1,Role2) &
  emptycell(X3,Y3)

legal(noop)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% operations
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

drop(N) :: control(Role) & lowpoint(M,N) & piece(Piece,disk,Role) ==> cell(M,N,Piece)
drop(N) :: kerchunk

pawnmove(X1,Y1,X2,Y2) :: cell(X1,Y1,Piece) ==> ~cell(X1,Y1,Piece) & cell(X2,Y2,Piece)
pawnmove(X1,Y1,X2,Y2) :: kerchunk

knightmove(M1,N1,M2,N2) :: cell(M1,N1,Piece) ==> ~cell(M1,N1,Piece) & cell(M2,N2,Piece)
knightmove(M1,N1,M2,N2) :: cell(M2,N2,Piece) ==> ~cell(M2,N2,Piece)
knightmove(M1,N1,M2,N2) :: cell(M2,N2,Piece) & start(Piece,M,N) ==> cell(M,N,Piece)
knightmove(M1,N1,M2,N2) :: kerchunk

checkermove(M1,N1,M2,N2) :: cell(M1,N1,Piece) ==> ~cell(M1,N1,Piece) & cell(M2,N2,Piece)
checkermove(M1,N1,M2,N2) :: kerchunk

jump(M1,N1,M2,N2,M3,N3) :: cell(M1,N1,Piece) ==> ~cell(M1,N1,Piece) & cell(M3,N3,Piece)
jump(M1,N1,M2,N2,M3,N3) :: cell(M2,N2,Piece) ==> ~cell(M2,N2,Piece)
jump(M1,N1,M2,N2,M3,N3) :: cell(M2,N2,Piece) & start(Piece,M,N) ==> cell(M,N,Piece)
jump(M1,N1,M2,N2,M3,N3) :: kerchunk

noop :: kerchunk

kerchunk :: step(T1) & succ(T1,T2) ==> ~step(T1) & step(T2)
kerchunk :: control(white) ==> ~control(white) & control(black)
kerchunk :: control(black) ==> ~control(black) & control(white)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% goal
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

goal(white,100) :- line(white)
goal(white,50) :- ~line(white) & ~line(black)
goal(white,0) :- line(black)

goal(black,100) :- line(black)
goal(black,50) :- ~line(white) & ~line(black)
goal(black,0) :- line(white)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% terminal
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

terminal :- line(Role)
terminal :- step(41)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% Views
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

orthogonal(X1,Y,X2,Y) :- plus1(X1,X2) & index(Y)
orthogonal(X1,Y,X2,Y) :- plus1(X2,X1) & index(Y)
orthogonal(X,Y1,X,Y2) :- plus1(Y1,Y2) & index(X)
orthogonal(X,Y1,X,Y2) :- plus1(Y2,Y1) & index(X)

diagonal(X1,Y1,X2,Y2) :- plus1(X1,X2) & plus1(Y1,Y2)
diagonal(X1,Y1,X2,Y2) :- plus1(X1,X2) & plus1(Y2,Y1)
diagonal(X1,Y1,X2,Y2) :- plus1(X2,X1) & plus1(Y1,Y2)
diagonal(X1,Y1,X2,Y2) :- plus1(X2,X1) & plus1(Y2,Y1)

ell(X1,Y1,X2,Y2) :- plus2(X2,X1) & plus1(Y1,Y2)
ell(X1,Y1,X2,Y2) :- plus1(X2,X1) & plus2(Y1,Y2)
ell(X1,Y1,X2,Y2) :- plus1(X1,X2) & plus2(Y1,Y2)
ell(X1,Y1,X2,Y2) :- plus2(X1,X2) & plus1(Y1,Y2)
ell(X1,Y1,X2,Y2) :- plus2(X2,X1) & plus1(Y2,Y1)
ell(X1,Y1,X2,Y2) :- plus1(X2,X1) & plus2(Y2,Y1)
ell(X1,Y1,X2,Y2) :- plus1(X1,X2) & plus2(Y2,Y1)
ell(X1,Y1,X2,Y2) :- plus2(X1,X2) & plus1(Y2,Y1)

jumpable(X1,Y1,X2,Y2,X3,Y3) :- plus1(X1,X2) & plus1(Y1,Y2) & plus1(X2,X3) & plus1(Y2,Y3)
jumpable(X1,Y1,X2,Y2,X3,Y3) :- plus1(X1,X2) & plus1(Y2,Y1) & plus1(X2,X3) & plus1(Y3,Y2)
jumpable(X1,Y1,X2,Y2,X3,Y3) :- plus1(X2,X1) & plus1(Y1,Y2) & plus1(X3,X2) & plus1(Y2,Y3)
jumpable(X1,Y1,X2,Y2,X3,Y3) :- plus1(X2,X1) & plus1(Y2,Y1) & plus1(X3,X2) & plus1(Y3,Y2)


lowpoint(M,N) :- lowpointfrom(1,N,M,N)

lowpointfrom(7,N,7,N) :- index(N)
lowpointfrom(M1,N,M1,N) :- plus1(M1,M2) & cell(M2,N,Piece)
lowpointfrom(M1,N,M3,N) :- plus1(M1,M2) & emptycell(M2,N) & lowpointfrom(M2,N,M3,N)

onboard(X,Y) :-
   index(X) & index(Y) &
   distinct(X,1) & distinct(X,7) &
   distinct(Y,1) & distinct(Y,7)

controls(X,Y,Role) :- cell(X,Y,Piece) & piece(Piece,Type,Role)

emptycell(X,Y) :- index(X) & index(Y) & ~controls(X,Y,white) & ~controls(X,Y,black)


line(Role) :- row(Role)
line(Role) :- column(Role)
line(Role) :- diag(Role)

row(Role) :- controls(3,3,Role) & controls(3,4,Role) & controls(3,5,Role)
row(Role) :- controls(4,3,Role) & controls(4,4,Role) & controls(4,5,Role)
row(Role) :- controls(5,3,Role) & controls(5,4,Role) & controls(5,5,Role)

column(Role) :- controls(3,3,Role) & controls(4,3,Role) & controls(5,3,Role)
column(Role) :- controls(3,4,Role) & controls(4,4,Role) & controls(5,4,Role)
column(Role) :- controls(3,5,Role) & controls(4,5,Role) & controls(5,5,Role)

diag(Role) :- controls(3,3,Role) & controls(4,4,Role) & controls(5,5,Role)
diag(Role) :- controls(3,5,Role) & controls(4,4,Role) & controls(5,3,Role)


oddsquare(X,Y) :- oddidx(X) & evenidx(Y)
oddsquare(X,Y) :- oddidx(Y) & evenidx(X)

function renderstate (state)
 {var step = compfindx('N',seq('step','N'),state,library);
  var role = compfindx('R',seq('control','R'),state,library);
  var table = document.createElement('table');
  table.setAttribute('border','0');
  var row = table.insertRow(0);
  var cell = row.insertCell(0);
  cell.setAttribute('align','center');
  cell.setAttribute('style','font-size:20px');
  cell.innerHTML = 'Step:  ' + step;
  row = table.insertRow(1);
  var cell = row.insertCell(0);
  var board = renderboard(state);
  cell.appendChild(board);
  row = table.insertRow(2);
  var cell = row.insertCell(0);
  cell.setAttribute('align','center');
  cell.setAttribute('style','font-size:20px');
  cell.innerHTML = 'Control:  ' + role;
  return table}

function renderboard (state)
 {var table = document.createElement('table');
  table.setAttribute('cellspacing','0');
  table.setAttribute('cellpadding','0');
  table.setAttribute('border','0');
  var row = table.insertRow(0);
  makenone(row,0,0,state);
  makenone(row,0,1,state);
  makecell(row,0,2,state);
  makecell(row,0,3,state);
  makecell(row,0,4,state);
  makenone(row,0,5,state);
  makenone(row,0,6,state);
  row = table.insertRow(1);
  makenone(row,1,0,state);
  makecell(row,1,1,state);
  makecell(row,1,2,state);
  makecell(row,1,3,state);
  makecell(row,1,4,state);
  makecell(row,1,5,state);
  makenone(row,1,6,state);
  row = table.insertRow(2);
  makecell(row,2,0,state);
  makecell(row,2,1,state);
  makegrey(row,2,2,state);
  makegrey(row,2,3,state);
  makegrey(row,2,4,state);
  makecell(row,2,5,state);
  makecell(row,2,6,state);
  row = table.insertRow(3);
  makecell(row,3,0,state);
  makecell(row,3,1,state);
  makegrey(row,3,2,state);
  makegrey(row,3,3,state);
  makegrey(row,3,4,state);
  makecell(row,3,5,state);
  makecell(row,3,6,state);
  row = table.insertRow(4);
  makecell(row,4,0,state);
  makecell(row,4,1,state);
  makegrey(row,4,2,state);
  makegrey(row,4,3,state);
  makegrey(row,4,4,state);
  makecell(row,4,5,state);
  makecell(row,4,6,state);
  row = table.insertRow(5);
  makenone(row,5,0,state);
  makecell(row,5,1,state);
  makecell(row,5,2,state);
  makecell(row,5,3,state);
  makecell(row,5,4,state);
  makecell(row,5,5,state);
  makenone(row,5,6,state);
  row = table.insertRow(6);
  makenone(row,6,0,state);
  makenone(row,6,1,state);
  makecell(row,6,2,state);
  makecell(row,6,3,state);
  makecell(row,6,4,state);
  makenone(row,6,5,state);
  makenone(row,6,6,state);
  return table}

function makenone (row,rownum,colnum)
 {var cell = row.insertCell(colnum);
  cell.setAttribute('width','40');
  cell.setAttribute('height','40');
  cell.innerHTML = '&nbsp;';
  return cell}

function makegrey (row,rownum,colnum,state)
 {var cell = row.insertCell(colnum);
  cell.setAttribute('width','40');
  cell.setAttribute('height','40');
  cell.setAttribute('align','center');
  cell.setAttribute('valign','center');
  cell.setAttribute('style','border: 2px solid #000;background-color:#dddddd');
  rownum = (rownum+1).toString();
  colnum = (colnum+1).toString();
  var mark = compfindx('Z',seq('cell',rownum,colnum,'Z'),state,seq());
  if (mark=='whitepawn') {cell.innerHTML = '<img src="../library/ttcc4/whitepawn.png" height="30" width="30"/>'};
  if (mark=='whitechecker') {cell.innerHTML = '<img src="../library/ttcc4/whitechecker.png" height="30" width="30"/>'};
  if (mark=='whiteknight') {cell.innerHTML = '<img src="../library/ttcc4/whiteknight.png" height="30" width="30"/>'};
  if (mark=='whitedisk') {cell.innerHTML = '<img src="../library/ttcc4/whitedisk.png" height="30" width="30"/>'};
  if (mark=='blackpawn') {cell.innerHTML = '<img src="../library/ttcc4/blackpawn.png" height="30" width="30"/>'};
  if (mark=='blackchecker') {cell.innerHTML = '<img src="../library/ttcc4/blackchecker.png" height="30" width="30"/>'};
  if (mark=='blackknight') {cell.innerHTML = '<img src="../library/ttcc4/blackknight.png" height="30" width="30"/>'};
  if (mark=='blackdisk') {cell.innerHTML = '<img src="../library/ttcc4/blackdisk.png" height="30" width="30"/>'};
  if (mark==false) {cell.innerHTML = '&nbsp;'};
  return cell}

function makecell (row,rownum,colnum,state)
 {var cell = row.insertCell(colnum);
  cell.setAttribute('width','40');
  cell.setAttribute('height','40');
  cell.setAttribute('align','center');
  cell.setAttribute('valign','center');
  cell.setAttribute('style','border: 2px solid #000');
  rownum = (rownum+1).toString();
  colnum = (colnum+1).toString();
  var mark = compfindx('Z',seq('cell',rownum,colnum,'Z'),state,seq());
  if (mark=='whitepawn') {cell.innerHTML = '<img src="../library/ttcc4/whitepawn.png" height="30" width="30"/>'};
  if (mark=='whitechecker') {cell.innerHTML = '<img src="../library/ttcc4/whitechecker.png" height="30" width="30"/>'};
  if (mark=='whiteknight') {cell.innerHTML = '<img src="../library/ttcc4/whiteknight.png" height="30" width="30"/>'};
  if (mark=='whitedisk') {cell.innerHTML = '<img src="../library/ttcc4/whitedisk.png" height="30" width="30"/>'};
  if (mark=='blackpawn') {cell.innerHTML = '<img src="../library/ttcc4/blackpawn.png" height="30" width="30"/>'};
  if (mark=='blackchecker') {cell.innerHTML = '<img src="../library/ttcc4/blackchecker.png" height="30" width="30"/>'};
  if (mark=='blackknight') {cell.innerHTML = '<img src="../library/ttcc4/blackknight.png" height="30" width="30"/>'};
  if (mark=='blackdisk') {cell.innerHTML = '<img src="../library/ttcc4/blackdisk.png" height="30" width="30"/>'};
  if (mark==false) {cell.innerHTML = '&nbsp;'};
  return cell}
