Three buttons and three lights.  The first button toggles the first light.  The second button interchanges first and second lights.  The third button interchanges the second and third lights.  All lights initially off.  The goal is to get them all on.  The game terminates when all three lights are on or after 6 steps, whichever comes first.

base(p)
base(q)
base(r)
base(step(1))
base(step(2))
base(step(3))
base(step(4))
base(step(5))
base(step(6))
base(step(7))
base(control(robot))

action(a)
action(b)
action(c)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

init(step(1))
init(control(robot))

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% legal

legal(a)
legal(b)
legal(c)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% operations
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

a :: ~p ==> p
a :: p ==> ~p
a :: step(M) & successor(M,N) ==> ~step(M) & step(N)

b :: q ==> p
b :: ~q ==> ~p
b :: p ==> q
b :: ~p ==> ~q
b :: step(M) & successor(M,N) ==> ~step(M) & step(N)

c :: q ==> r
c :: ~q ==> ~r
c :: r ==> q
c :: ~r ==> ~q
c :: step(M) & successor(M,N) ==> ~step(M) & step(N)

goal(robot,50) :- p & q & ~r
goal(robot,50) :- p & ~q & r
goal(robot,50) :- ~p & q & r
goal(robot,25) :- p & ~q & ~r
goal(robot,25) :- ~p & q & ~r
goal(robot,25) :- p & ~q & ~r
goal(robot,0) :- ~p & ~q & ~r

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% terminal
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

terminal :- p & q & r
terminal :- step(7)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

successor(2,3)

</textarea></td></tr><tr><td align='center'>Stylesheet</td><td><textarea style='font-family:courier;width:100%' rows='20' disabled>//==============================================================================
// buttonsandlights
//==============================================================================

function renderstate (state)
 {var step = compfindx('N',seq('step','N'),state,library);
  var table = document.createElement('table');
  table.setAttribute('border','0');
  var row = table.insertRow(0);
  var cell = row.insertCell(0);
  cell.setAttribute('align','center');
  cell.setAttribute('style','font-size:20px');
  cell.innerHTML = 'Step:  ' + step;
  row = table.insertRow(1);
  var cell = row.insertCell(0);
  var board = renderboard(state);
  cell.appendChild(board);
  row = table.insertRow(2);
  var cell = row.insertCell(0);
  cell.setAttribute('align','center');
  cell.setAttribute('style','font-size:20px');
  if (compfindp('terminal',state,library))
     {cell.innerHTML = 'Game over'}
     else {cell.innerHTML = '&nbsp;'};
  return table}

function renderboard (state)
 {var table = document.createElement('table');
  table.setAttribute('cellspacing','0');
  table.setAttribute('bgcolor','white');
  table.setAttribute('border','4');
  makerow(table,0,state);
  return table}

function makerow (table,rownum,state)
 {var row =table.insertRow(rownum);
  makecell(row,'p',state);
  makecell(row,'q',state);
  makecell(row,'r',state);
  return row}

function makecell (row,light,state)
 {var cell = row.insertCell(row.cells.length);
  cell.setAttribute('width','40');
  cell.setAttribute('height','40');
  cell.setAttribute('align','center');
  cell.setAttribute('valign','center');
  if (compfindp(light,state,seq()))
     {cell.innerHTML = '<img src="../library/buttonsandlights/green.jpg"/>'}
     else {cell.innerHTML = '<img src="../library/buttonsandlights/red.jpg"/>'};
  return cell}
