<table width='100%' cellpadding='4' cellspacing='0' border='1'><tr height='40' bgcolor='#e4eaea'><th colspan='2'>threepuzzle</th></tr><tr><td width='100' align='center'>Description</td><td><textarea style='width:100%' rows='5' disabled>
Three Puzzle is a simple sliding tile puzzle. The game board is a 2x2 square with numbered tiles in all but one of the cells.

The state of the game is modified by sliding numbered tiles into the empty space from adjacent cells, thus moving the empty space to a new location. There are four possible moves - moving the empty space up, down, left, or right. Obviously, not all moves are possible in all states.

The ultimate object of the game is to place the tiles in order and position the empty square in the lower right cell.  The game terminates after 6 moves. The goal state is worth 100 points; all other states are worth 0 points.
</textarea></td></tr><tr><td align='center'>Rulesheet</td><td><textarea style='font-family:courier;width:100%' rows='20' disabled>%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% threepuzzle
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% metadata
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

role(robot)

base(board(X,Y,Z,b)) :- tile(X) & tile(Y) & tile(Z)
base(board(X,Y,b,Z)) :- tile(X) & tile(Y) & tile(Z)
base(board(X,b,Y,Z)) :- tile(X) & tile(Y) & tile(Z)
base(board(b,X,Y,Z)) :- tile(X) & tile(Y) & tile(Z)
base(step(1))
base(step(N)) :- successor(M,N)

action(up)
action(down)
action(left)
action(right)

tile(1)
tile(2)
tile(3)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% init
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

init(board(b,3,2,1))
init(step(1))
control(robot)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% legal
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

legal(up) :- board(X,Y,b,Z)
legal(up) :- board(X,Y,Z,b)

legal(down) :- board(b,X,Y,Z)
legal(down) :- board(X,b,Y,Z)

legal(left) :- board(X,b,Y,Z)
legal(left) :- board(X,Y,Z,b)

legal(right) :- board(b,X,Y,Z)
legal(right) :- board(X,Y,b,Z)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% operations
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

up :: board(X,Y,b,Z) ==> ~board(X,Y,b,Z) & board(b,Y,X,Z)
up :: board(X,Y,Z,b) ==> ~board(X,Y,Z,b) & board(X,b,Z,Y)

down :: board(b,X,Y,Z) ==> ~board(b,X,Y,Z) & board(Y,X,b,Z)
down :: board(X,b,Y,Z) ==> ~board(X,b,Y,Z) & board(X,Z,Y,b)

left :: board(X,b,Y,Z) ==> ~board(X,b,Y,Z) & board(b,X,Y,Z)
left :: board(X,Y,Z,b) ==> ~board(X,Y,Z,b) & board(X,Y,b,Z)

right :: board(b,X,Y,Z) ==> ~board(b,X,Y,Z) & board(X,b,Y,Z)
right :: board(X,Y,b,Z) ==> ~board(X,Y,b,Z) & board(X,Y,Z,b)

up ::    step(M) & successor(M,N) ==> ~step(M) & step(N)
down ::  step(M) & successor(M,N) ==> ~step(M) & step(N)
left ::  step(M) & successor(M,N) ==> ~step(M) & step(N)
right :: step(M) & successor(M,N) ==> ~step(M) & step(N)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% goal
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

goal(robot,100) :- board(1,2,3,b)
goal(robot,0) :- ~board(1,2,3,b)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% terminal
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

terminal :- step(7)

successor(1,2)
successor(2,3)
successor(3,4)
successor(4,5)
successor(5,6)
successor(6,7)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

</textarea></td></tr><tr><td align='center'>Stylesheet</td><td><textarea style='font-family:courier;width:100%' rows='20' disabled>//==============================================================================
// threepuzzle
//==============================================================================

function renderstate (state)
 {var table = document.createElement('table');
  table.setAttribute('cellspacing','0');
  table.setAttribute('bgcolor','white');
  table.setAttribute('border','10');
  table.setAttribute('style','font-size:24');
  makerow(table,0,state);
  makerow(table,1,state);
  return table}

function makerow (table,rownum,state)
 {var row =table.insertRow(rownum);
  makecell(row,rownum,0,state);
  makecell(row,rownum,1,state);
  return row}

function makecell (row,rownum,colnum,state)
 {var cell = row.insertCell(colnum);
  cell.setAttribute('width','40');
  cell.setAttribute('height','40');
  cell.setAttribute('align','center');
  cell.setAttribute('valign','center');
  var mark = findmark(rownum,colnum,state)
  if (mark && mark != 'b') {cell.innerHTML = mark}
     else {cell.innerHTML = '&nbsp;'};
  return cell}

function findmark (rownum,colnum,state)
 {if (rownum===0 && colnum===0)
     {return compfindx('M',read('board(M,X,Y,Z)'),state, [])};
  if (rownum===0 && colnum===1)
     {return compfindx('M',read('board(X,M,Y,Z)'),state, [])};
  if (rownum===1 && colnum===0)
     {return compfindx('M',read('board(X,Y,M,Z)'),state, [])};
  if (rownum===1 && colnum===1)
     {return compfindx('M',read('board(X,Y,Z,M)'),state, [])}
  return false}
