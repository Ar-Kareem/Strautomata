<table width='100%' cellpadding='4' cellspacing='0' border='1'><tr height='40' bgcolor='#e4eaea'><th colspan='2'>leafymcfallface</th></tr><tr><td width='100' align='center'>Description</td><td><textarea style='width:100%' rows='5' disabled>There are two caterpillars on a grid of leaves, initially at opposite corners. Each time they move, they eat the leaf behind them and move to a horizontally or vertically adjacent non-empty square.  If a player still has a move and its opponent has no moves (i.e. it is surrounded by empty space), then the first player gets 100 points and the second player gets 0 points.  Otherwise, both players get 0 points.</textarea></td></tr><tr><td align='center'>Rulesheet</td><td><textarea style='font-family:courier;width:100%' rows='20' disabled>%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

legal(move(X,Y)) :-

  control(R) & isplayer(OX,OY,R)
  ==> ~leaf(X,Y) & ~isplayer(OX,OY,R) & isplayer(X,Y,R)

// leafymcfallface
//==============================================================================

function renderstate (state)
 {var role = compfindx('R',seq('control','R'),state,library);
  var table = document.createElement('table');
  table.setAttribute('border','0');
  var row = table.insertRow(table.rows.length);
  var cell = row.insertCell(0);
  var board = renderboard(state);
  cell.appendChild(board);
  row = table.insertRow(table.rows.length);
  var cell = row.insertCell(0);
  cell.setAttribute('align','center');
  cell.setAttribute('style','font-size:20px');
  if (compfindp('terminal',state,library))
     {cell.innerHTML = 'Game over'}
     else {cell.innerHTML = 'Control:  ' + role};
  return table}

function renderboard (state)
 {var table = document.createElement('table');
  table.setAttribute('cellspacing','0');
  table.setAttribute('bgcolor','white');
  table.setAttribute('border','10');
  for (var i = 0; i < 7; i++)
    makerow(table,i,state);
  return table}

function makerow (table,rownum,state)
 {var row =table.insertRow(rownum);
  for (var i = 0; i < 7; i++)
    makecell(row,rownum,i,state);
  return row}

function makecell (row,rownum,colnum,state)
 {var cell = row.insertCell(colnum);
  cell.setAttribute('width','40');
  cell.setAttribute('height','40');
  cell.setAttribute('align','center');
  cell.setAttribute('valign','center');
  cell.setAttribute('style','font-family:helvetica;font-size:18pt');
  rownum = (rownum+1).toString();
  colnum = (colnum+1).toString();
  var leaf = compfindp(seq('leaf',rownum,colnum),state,seq());
  var player = compfindx("Z", seq('isplayer',rownum,colnum,"Z"),state,seq());
  if (player) {
     cell.style.backgroundColor = player;
  } else if (leaf) {
     cell.style.backgroundColor = "green";
  }
  return cell}
