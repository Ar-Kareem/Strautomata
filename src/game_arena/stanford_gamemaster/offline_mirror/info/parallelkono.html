<table width='100%' cellpadding='4' cellspacing='0' border='1'><tr height='40' bgcolor='#e4eaea'><th colspan='2'>parallelkono</th></tr><tr><td width='100' align='center'>Description</td><td><textarea style='width:100%' rows='5' disabled>
Kono is a game played on a 4x4 grid.  Red pieces on the bottom two rows of the board and black pieces on the top two rows of the board.  Pieces can move forward one step along lines connecting vertices or can jump over a piece of their own color to capture an opponent's piece on the opposite side.  Each player gets points for each piece captured.  The game terminates on move 30 or when one of the players has no more pieces to move.
</textarea></td></tr><tr><td align='center'>Rulesheet</td><td><textarea style='font-family:courier;width:100%' rows='20' disabled>%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% parallelkono
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% metadata
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

role(red)
role(black)

base(cell(B,M,N,Mark)) :- board(B) & index(M) & index(N) & mark(Mark)
base(played(B)) :- board(B)
base(score(R,0)) :- role(R)
base(score(R,N)) :- role(R) & incr(M,N)
base(step(1))
base(step(N)) :- succ(M,N)
base(control(R)) :- role(R)

action(move(B,U,V,X,Y)) :- board(B) & doublet(U,V,X,Y)
action(jump(B,U,V,W,X,Y,Z)) :- board(B) & triplet(U,V,W,X,Y,Z)
action(tick)

board(a)
board(b)

mark(red)
mark(black)
mark(blank)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% init
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

init(cell(a,1,1,black))
init(cell(a,1,2,black))
init(cell(a,1,3,black))
init(cell(a,1,4,black))
init(cell(a,2,1,black))
init(cell(a,2,2,black))
init(cell(a,2,3,black))
init(cell(a,2,4,black))
init(cell(a,3,1,red))
init(cell(a,3,2,red))
init(cell(a,3,3,red))
init(cell(a,3,4,red))
init(cell(a,4,1,red))
init(cell(a,4,2,red))
init(cell(a,4,3,red))
init(cell(a,4,4,red))
init(cell(b,1,1,black))
init(cell(b,1,2,black))
init(cell(b,1,3,black))
init(cell(b,1,4,black))
init(cell(b,2,1,black))
init(cell(b,2,2,black))
init(cell(b,2,3,black))
init(cell(b,2,4,black))
init(cell(b,3,1,red))
init(cell(b,3,2,red))
init(cell(b,3,3,red))
init(cell(b,3,4,red))
init(cell(b,4,1,red))
init(cell(b,4,2,red))
init(cell(b,4,3,red))
init(cell(b,4,4,red))
init(score(red,0))
init(score(black,0))
init(step(1))
init(control(red))

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% legal
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

legal(move(B,U,V,X,Y)) :-
  control(R) & cell(B,U,V,R) & ~played(B) & doublet(U,V,X,Y) & cell(B,X,Y,blank)

legal(jump(B,U,V,W,X,Y,Z)) :-
  control(red) & cell(B,U,V,red) & ~played(B) & triplet(U,V,W,X,Y,Z) & cell(B,W,X,red) & cell(B,Y,Z,black)

legal(jump(B,U,V,W,X,Y,Z)) :-
  control(black) & cell(B,U,V,black) & ~played(B) & triplet(U,V,W,X,Y,Z) & cell(B,W,X,black) & cell(B,Y,Z,red)

legal(tick)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% operations
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

move(B,U,V,X,Y) :: cell(B,U,V,R) ==> ~cell(B,U,V,R) & cell(B,U,V,blank)
move(B,U,V,X,Y) :: cell(B,U,V,R) ==> ~cell(B,X,Y,blank) & cell(B,X,Y,R)
move(B,U,V,X,Y) :: played(B)

jump(B,U,V,W,X,Y,Z) :: cell(B,U,V,R) ==> ~cell(B,U,V,R) & cell(B,U,V,blank)
jump(B,U,V,W,X,Y,Z) :: cell(B,U,V,R) & cell(B,Y,Z,S) ==> ~cell(B,Y,Z,S) & cell(B,Y,Z,R)
jump(a,U,V,W,X,Y,Z) :: control(red) & score(red,M) & incr(M,N) ==> ~score(red,M) & score(red,N)
jump(b,U,V,W,X,Y,Z) :: control(black) & score(black,M) & incr(M,N) ==> ~score(black,M) & score(black,N)
jump(B,U,V,W,X,Y,Z) :: played(B)

tick :: ~played(a) & ~played(b)
tick :: step(M) & succ(M,N) ==> ~step(M) & step(N)
tick :: control(black) ==> ~control(black) & control(red)
tick :: control(red) ==> ~control(red) & control(black)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% goal
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

goal(R,N) :- score(R,N)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% terminal
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

terminal :- step(30)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% Views
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

doublet(U,V,X,Y) :- horizontal(U,V,X,Y)
doublet(U,V,X,Y) :- horizontal(X,Y,U,V)
doublet(U,V,X,Y) :- vertical(U,V,X,Y)
doublet(U,V,X,Y) :- vertical(X,Y,U,V)

triplet(U,V,W,X,Y,Z) :- horizontal(U,V,W,X) & horizontal(W,X,Y,Z)
triplet(U,V,W,X,Y,Z) :- horizontal(Y,Z,W,X) & horizontal(W,X,U,V)
triplet(U,V,W,X,Y,Z) :- vertical(U,V,W,X) & vertical(W,X,Y,Z)
triplet(U,V,W,X,Y,Z) :- vertical(Y,Z,W,X) & vertical(W,X,U,V)

horizontal(U,V,X,V) :- nextspot(U,X) & index(V)
vertical(U,V,U,Y) :- nextspot(V,Y) & index(U)

// parallelkono
//------------------------------------------------------------------------------

function renderstate (state)
 {var step = compfindx('N',seq('step','N'),state,library);
  var role = compfindx('R',seq('control','R'),state,library);
  var table = document.createElement('table');
  table.setAttribute('border','0');
  var row = table.insertRow(0);
  var cell = row.insertCell(0);
  cell.setAttribute('align','center');
  cell.setAttribute('style','font-size:20px');
  cell.innerHTML = 'Step:  ' + step;
  row = table.insertRow(1);
  var cell = row.insertCell(0);
  var board = renderboard(state);
  cell.appendChild(board);
  row = table.insertRow(2);
  var cell = row.insertCell(0);
  cell.setAttribute('align','center');
  cell.setAttribute('style','font-size:20px');
  if (compfindp('terminal',state,library))
     {cell.innerHTML = 'Game over'}
     else {cell.innerHTML = 'Control:  ' + role};
  return table}

function renderboard (state)
 {var table = document.createElement('table');
  table.setAttribute('cellspacing','20');
  table.setAttribute('cellpadding','0');
  table.setAttribute('border','0');
  var row = table.insertRow(0);
  var cell = row.insertCell(0);
  cell.appendChild(render('a',state));
  cell = row.insertCell(1);
  cell.appendChild(render('b',state));
  return table}

function render (game,state)
 {var canvas = document.createElement('canvas');
  canvas.setAttribute('width','210px');
  canvas.setAttribute('height','210px');

  drawline( 15, 15,195, 15,canvas);
  drawline( 15, 75,195, 75,canvas);
  drawline( 15,135,195,135,canvas);
  drawline( 15,195,195,195,canvas);

  drawline( 15, 15, 15,195,canvas);
  drawline( 75, 15, 75,195,canvas);
  drawline(135, 15,135,195,canvas);
  drawline(195, 15,195,195,canvas);

  drawnode(game,'1','1',  0,  0,state,canvas);
  drawnode(game,'1','2', 60,  0,state,canvas);
  drawnode(game,'1','3',120,  0,state,canvas);
  drawnode(game,'1','4',180,  0,state,canvas);

  drawnode(game,'2','1',  0, 60,state,canvas);
  drawnode(game,'2','2', 60, 60,state,canvas);
  drawnode(game,'2','3',120, 60,state,canvas);
  drawnode(game,'2','4',180, 60,state,canvas);

  drawnode(game,'3','1',  0,120,state,canvas);
  drawnode(game,'3','2', 60,120,state,canvas);
  drawnode(game,'3','3',120,120,state,canvas);
  drawnode(game,'3','4',180,120,state,canvas);

  drawnode(game,'4','1',  0,180,state,canvas);
  drawnode(game,'4','2', 60,180,state,canvas);
  drawnode(game,'4','3',120,180,state,canvas);
  drawnode(game,'4','4',180,180,state,canvas);

  return canvas}

//------------------------------------------------------------------------------
// Drawing subroutines
//------------------------------------------------------------------------------

function drawred (x,y,w)
 {var ctx = w.getContext('2d');
  ctx.beginPath();
  ctx.lineWidth=2;
  ctx.arc(x+15,y+15,12,0,2*Math.PI,false);
  ctx.stroke();
  ctx.fillStyle = "#ff8888";
  ctx.fill();}

function drawblack (x,y,w)
 {var ctx = w.getContext('2d');
  ctx.beginPath();
  ctx.lineWidth=2;
  ctx.arc(x+15,y+15,12,0,2*Math.PI,false);
  ctx.stroke();
  ctx.fillStyle = "#888888";
  ctx.fill();}

function drawblank (x,y,w)
 {var ctx = w.getContext('2d');
  ctx.beginPath();
  ctx.lineWidth=2;
  ctx.arc(x+15,y+15,12,0,2*Math.PI,false);
  ctx.stroke();
  ctx.fillStyle = "#ffffff";
  ctx.fill();}

function drawline(u,v,x,y,w)
 {var ctx = w.getContext('2d');
  ctx.beginPath();
  ctx.lineWidth=2;
  ctx.moveTo(u,v);
  ctx.lineTo(x,y);
  ctx.stroke()}

function drawnode (game,m,n,x,y,state,canvas)
 {var mark = compfindx('X',seq('cell',game,m,n,'X'),state,library);
  if (mark=='red') {drawred(x,y,canvas); return true};
  if (mark=='black') {drawblack(x,y,canvas); return true};
  drawblank(x,y,canvas);
  return true}

function drawscore (text,x,y,w)
 {var ctx = w.getContext('2d');
  ctx.fillStyle = "#000000";
  ctx.font="28px Times"
  ctx.fillText(text,x+12,y+18);
  return true}
