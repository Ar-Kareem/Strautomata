<table width='100%' cellpadding='4' cellspacing='0' border='1'><tr height='40' bgcolor='#e4eaea'><th colspan='2'>bestbuttonsandlights</th></tr><tr><td width='100' align='center'>Description</td><td><textarea style='width:100%' rows='5' disabled>The overall game consists of nine copies of Buttons and Lights.  In each copy of Buttons and Lights, there are three lights and three buttons.  Pushing the first button in each group toggles the first light; pushing the second button in each group interchanges the first and second lights; and pushing the third button in each group interchanges the second and third lights.  Initially, the lights are all off.  90 points for groups in the first row, 100 points for groups in the second row, 80 points for groups in the third row.  The game starts on step 1 and ends on step 7.</textarea></td></tr><tr><td align='center'>Rulesheet</td><td><textarea style='font-family:courier;width:100%' rows='20' disabled>%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% bestbuttonsandlights
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% metadata
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

role(robot)

base(p(X)) :- index(X)
base(q(X)) :- index(X)
base(r(X)) :- index(X)

base(step(X,1)) :- index(X)
base(step(X,2)) :- index(X)
base(step(X,3)) :- index(X)
base(step(X,4)) :- index(X)
base(step(X,5)) :- index(X)
base(step(X,6)) :- index(X)
base(step(X,7)) :- index(X)

action(a(X)) :- index(X)
action(b(X)) :- index(X)
action(c(X)) :- index(X)

index(1)
index(2)
index(3)
index(4)
index(5)
index(6)
index(7)
index(8)
index(9)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% init
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

init(step(1,1))
init(step(2,1))
init(step(3,1))
init(step(4,1))
init(step(5,1))
init(step(6,1))
init(step(7,1))
init(step(8,1))
init(step(9,1))
init(control(robot))

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% legal
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

legal(a(X)) :- index(X)
legal(b(X)) :- index(X)
legal(c(X)) :- index(X)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% operations
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

a(X) :: ~p(X) ==> p(X)
a(X) :: p(X) ==> ~p(X)
a(X) :: step(X,M) & successor(M,N) ==> ~step(X,M) & step(X,N)

b(X) :: q(X) ==> p(X)
b(X) :: ~q(X) ==> ~p(X)
b(X) :: p(X) ==> q(X)
b(X) :: ~p(X) ==> ~q(X)
b(X) :: step(M) & successor(M,N) ==> ~step(X,M) & step(X,N)

c(X) :: q(X) ==> r(X)
c(X) :: ~q(X) ==> ~r(X)
c(X) :: r(X) ==> q(X)
c(X) :: ~r(X) ==> ~q(X)
c(X) :: step(X,M) & successor(M,N) ==> ~step(X,M) & step(X,N)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

done(X) :- p(X) & q(X) & r(X)

over(X) :- done(X)

successor(6,7)

// bestbuttonsandlights
//------------------------------------------------------------------------------

function renderstate (state)
 {var table = document.createElement('table');
  table.setAttribute('cellspacing','0');
  table.setAttribute('border','0');
  var row = table.insertRow(0);
  var cell = row.insertCell(0);
  cell.appendChild(maketable('1',state));
  cell = row.insertCell(1);
  cell.appendChild(maketable('2',state));
  cell = row.insertCell(2);
  cell.appendChild(maketable('3',state));
  row = table.insertRow(1);
  cell = row.insertCell(0);
  cell.appendChild(maketable('4',state));
  cell = row.insertCell(1);
  cell.appendChild(maketable('5',state));
  cell = row.insertCell(2);
  cell.appendChild(maketable('6',state));
  row = table.insertRow(2);
  cell = row.insertCell(0);
  cell.appendChild(maketable('7',state));
  cell = row.insertCell(1);
  cell.appendChild(maketable('8',state));
  cell = row.insertCell(2);
  cell.appendChild(maketable('9',state));
  return table}

function maketable (component,state)
 {var table = document.createElement('table');
  table.setAttribute('cellspacing','0');
  table.setAttribute('bgcolor','white');
  table.setAttribute('border','4');
  makerow(table,0,component,state);
  return table}

function makerow (table,rownum,component,state)
 {var row =table.insertRow(rownum);
  makecell(row,seq('p',component),state);
  makecell(row,seq('q',component),state);
  makecell(row,seq('r',component),state);
  return row}

function makecell (row,light,state)
 {var cell = row.insertCell(row.cells.length);
  cell.setAttribute('width','40');
  cell.setAttribute('height','40');
  cell.setAttribute('align','center');
  cell.setAttribute('valign','center');
  if (compfindp(light,state,seq()))
     {cell.innerHTML = '<img src="../library/buttonsandlights/green.jpg"/>'}
     else {cell.innerHTML = '<img src="../library/buttonsandlights/red.jpg"/>'};
  return cell}
