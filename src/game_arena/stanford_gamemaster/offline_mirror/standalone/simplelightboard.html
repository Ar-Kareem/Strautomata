//==============================================================================
// Game parameters
//==============================================================================

var game = 'simplelightboard';
var startclock = Infinity;
var playclock = Infinity;

function dogame ()
 {game = prompt("What game do you want to play?");
  location.href = makeurl();
  return true}

function dostartclock ()
 {startclock = prompt("How many seconds on the start clock?");
  location.href = makeurl();
  return true}

function doplayclock ()
 {playclock = prompt("How many seconds on the play clock?");
  location.href = makeurl();
  return true}

function makeurl ()
 {return game + '.html'}

//==============================================================================
// End of game parameters//==============================================================================
  </script>
  <script type='text/javascript'>
//------------------------------------------------------------------------------
// lightboard
//------------------------------------------------------------------------------

function renderstate (state)
 {var table = document.createElement('table');
  table.setAttribute('cellspacing','0');
  table.setAttribute('bgcolor','#f4f6f8');
  table.setAttribute('border','4');
  for (var i=0; i<9; i++) {makerow(table,i,state)};
  return table}

function makerow (table,rownum,state)
 {var row =table.insertRow(rownum);
  for (var j=0; j<9; j++) {makecell(row,rownum,j,state)};
  return row}

function makecell (row,rownum,colnum,state)
 {var cell = row.insertCell(row.cells.length);
  cell.setAttribute('width','40');
  cell.setAttribute('height','40');
  cell.setAttribute('align','center');
  cell.setAttribute('valign','center');
  if (compfindp(seq('on',(rownum+1).toString(),(colnum+1).toString()),state,seq()))
     {cell.innerHTML = '<img src="../library/lightboard/green.jpg"/>'}
     else {cell.innerHTML = '<img src="../library/lightboard/red.jpg"/>'};
  return cell}

//------------------------------------------------------------------------------
//------------------------------------------------------------------------------
//------------------------------------------------------------------------------
  </script>
