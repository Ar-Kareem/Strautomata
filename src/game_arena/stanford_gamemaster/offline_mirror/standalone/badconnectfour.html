 {return game + '.html'}

  <script type='text/javascript'>
//------------------------------------------------------------------------------
// connectfour
//------------------------------------------------------------------------------

function renderstate (state)
 {var table = document.createElement('table');
  table.setAttribute('cellspacing','0');
  table.setAttribute('cellpadding','0');
  table.setAttribute('border','10');
  for (var i=0; i<6; i++)
      {var row = table.insertRow(i);
       var rownum = String(6-i);
       for (var j=0; j<8; j++)
           {var cell = row.insertCell(j);
            var colnum = String(j+1);
            var filler = compfindx('Z',seq('cell',colnum,rownum,'Z'),state,seq());
            cell.height='60';
            cell.width='60';
            cell.align='center';
            cell.valign='center';
            if (filler=='red')
               {cell.innerHTML = '<img src="../library/connectfour/red.png" height="50"/>'};
            if (filler=='black')
               {cell.innerHTML = '<img src="../library/connectfour/blue.png" height="50"/>'};
            if (filler==false)
               {cell.innerHTML = '&nbsp;'}}};
  return table}

//------------------------------------------------------------------------------
//------------------------------------------------------------------------------
//------------------------------------------------------------------------------
  </script>

<textarea id='library' type='text/hrf' style='display:none'>
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% connectfour
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% metadata
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

role(red)
role(black)

base(cell(X,Y,P)) :- column(X) & height(Y) & role(P)
base(control(red))
base(control(black))

action(drop(X)) :- column(X)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% init
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

init(control(red))

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% legal
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

legal(drop(X)) :-
  columnopen(X)

legal(drop(X)) :-
  columnopen(U) & 
  columnopen(V) & 
  columnopen(W) & 
  columnopen(X) & 
  columnopen(Y) & 
  columnopen(Z)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% operations
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

drop(X) :: control(Player) & columnempty(X) ==> cell(X,1,Player)

drop(X) ::
  control(Player) & cellopen(X,Y2) & succ(Y1,Y2) & ~cellopen(X,Y1)
  ==> cell(X,Y2,Player)

drop(X) :: control(red) ==> ~control(red) & control(black)
drop(X) :: control(black) ==> ~control(black) & control(red)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% goal
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

goal(red,100) :- line(red)
goal(red,50) :- ~line(red) & ~line(black) & ~boardopen
goal(red,0) :- line(black)
goal(red,0) :- ~line(red) & ~line(black) & boardopen

goal(black,100) :- line(black)
goal(black,50) :- ~line(red) & ~line(black) & ~boardopen
goal(black,0) :- line(red)
goal(black,0) :- ~line(red) & ~line(black) & boardopen

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% terminal
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

terminal :- line(red)
terminal :- line(black)
terminal :- ~boardopen

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% Views
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

cellopen(X,Y) :- column(X) & height(Y) & ~cell(X,Y,red) & ~cell(X,Y,black)
columnopen(X) :- cellopen(X,6)
columnempty(X) :- cellopen(X,1)
boardopen :- columnopen(X)

line(Player) :-
  cell(X1,Y,Player) &
  succ(X1,X2) &
  succ(X2,X3) &
  succ(X3,X4) &
  cell(X2,Y,Player) &
  cell(X3,Y,Player) &
  cell(X4,Y,Player)

line(Player) :-
  cell(X,Y1,Player) &
  succ(Y1,Y2) &
  succ(Y2,Y3) &
  succ(Y3,Y4) &
  cell(X,Y2,Player) &
  cell(X,Y3,Player) &
  cell(X,Y4,Player)

line(Player) :-
  cell(X1,Y1,Player) &
  succ(X1,X2) &
  succ(X2,X3) &
  succ(X3,X4) &
  succ(Y1,Y2) &
  succ(Y2,Y3) &
  succ(Y3,Y4) &
  cell(X2,Y2,Player) &
  cell(X3,Y3,Player) &
  cell(X4,Y4,Player)

line(Player) :-
  cell(X1,Y4,Player) &
  succ(X1,X2) &
  succ(X2,X3) &
  succ(X3,X4) &
  succ(Y3,Y4) &
  succ(Y2,Y3) &
  succ(Y1,Y2) &
  cell(X2,Y3,Player) &
  cell(X3,Y2,Player) &
  cell(X4,Y1,Player)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% Data
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

succ(1,2)
succ(2,3)
succ(3,4)
succ(4,5)
succ(5,6)
succ(6,7)
succ(7,8)

column(1)
column(2)
column(3)
column(4)
column(5)
column(6)
column(7)
column(8)

height(1)
height(2)
height(3)
height(4)
height(5)
height(6)
