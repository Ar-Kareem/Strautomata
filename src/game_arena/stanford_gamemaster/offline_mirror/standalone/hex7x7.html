  location.href = makeurl();

  location.href = makeurl();

 {return game + '.html'}

  <script type='text/javascript'>
//==============================================================================
// Hex
//==============================================================================

function renderstate (state)
 {var step = compfindx('N',seq('step','N'),state,library);
  var role = compfindx('R',seq('control','R'),state,library);
  var table = document.createElement('table');
  table.setAttribute('border','0');
  var row = table.insertRow(0);
  var cell = row.insertCell(0);
  cell.setAttribute('align','center');
  cell.setAttribute('style','font-size:20px');
  cell.innerHTML = 'Step:  ' + step;
  row = table.insertRow(1);
  var cell = row.insertCell(0);
  var board = renderboard(state);
  cell.appendChild(board);
  row = table.insertRow(2);
  var cell = row.insertCell(0);
  cell.setAttribute('align','center');
  cell.setAttribute('style','font-size:20px');
  if (compfindp('terminal',state,library))
     {cell.innerHTML = 'Game over'}
     else {cell.innerHTML = 'Control:  ' + role};
  return table}

function renderboard (state)
 {var canvas = document.createElement('canvas');
  canvas.setAttribute('width','400px');
  canvas.setAttribute('height','340px');

  drawhex(180, 40,canvas);

  drawreddish(150, 60,canvas);
  drawgrey(210, 60,canvas);

  drawreddish(120, 80,canvas);
  drawhex(180, 80,canvas);
  drawgrey(240, 80,canvas);

  drawreddish( 90,100,canvas);
  drawhex(150,100,canvas);
  drawhex(210,100,canvas);
  drawgrey(270,100,canvas);

  drawreddish( 60,120,canvas);
  drawhex(120,120,canvas);
  drawhex(180,120,canvas);
  drawhex(240,120,canvas);
  drawgrey(300,120,canvas);

  drawreddish( 30,140,canvas);
  drawhex( 90,140,canvas);
  drawhex(150,140,canvas);
  drawhex(210,140,canvas);
  drawhex(270,140,canvas);
  drawgrey(330,140,canvas);

  drawhex(  0,160,canvas);
  drawhex(60,160,canvas);
  drawhex(120,160,canvas);
  drawhex(180,160,canvas);
  drawhex(240,160,canvas);
  drawhex(300,160,canvas);
  drawhex(360,160,canvas);

  drawgrey( 30,180,canvas);
  drawhex( 90,180,canvas);
  drawhex(150,180,canvas);
  drawhex(210,180,canvas);
  drawhex(270,180,canvas);
  drawreddish(330,180,canvas);

  drawgrey( 60,200,canvas);
  drawhex(120,200,canvas);
  drawhex(180,200,canvas);
  drawhex(240,200,canvas);
  drawreddish(300,200,canvas);

  drawgrey( 90,220,canvas);
  drawhex(150,220,canvas);
  drawhex(210,220,canvas);
  drawreddish(270,220,canvas);

  drawgrey(120,240,canvas);
  drawhex(180,240,canvas);
  drawreddish(240,240,canvas);

  drawgrey(150,260,canvas);
  drawreddish(210,260,canvas);

  drawhex(180,280,canvas);

  for (var i=0; i<state.length; i++)
      {if (state[i][0]=='cell')
          {var x = xpos(state[i][1],state[i][2]);
           var y = ypos(state[i][1],state[i][2]);
           if (state[i][3]=='red') {drawred(x,y,canvas)};
           if (state[i][3]=='black') {drawblack(x,y,canvas)}}};

  return canvas}

function xpos (m,n)
 {return xm(m)+xn(n)}

function ypos (m,n)
 {return 160+ym(m)-yn(n)}

function xm (m)
 {if (m=='a') {return 0};
  if (m=='b') {return 30};
  if (m=='c') {return 60};
  if (m=='d') {return 90};
  if (m=='e') {return 120};
  if (m=='f') {return 150};
  if (m=='g') {return 180};
  if (m=='h') {return 210};
  if (m=='i') {return 240};
  if (m=='j') {return 270};
  if (m=='k') {return 300};
  return 330}

function ym (m)
 {if (m=='a') {return 0};
  if (m=='b') {return 20};
  if (m=='c') {return 40};
  if (m=='d') {return 60};
  if (m=='e') {return 80};
  if (m=='f') {return 100};
  if (m=='g') {return 120};
  if (m=='h') {return 140};
  if (m=='i') {return 160};
  if (m=='j') {return 180};
  if (m=='k') {return 200};
  return 330}

function yn (n)
 {if (n=='1') {return 0};
  if (n=='2') {return 20};
  if (n=='3') {return 40};
  if (n=='4') {return 60};
  if (n=='5') {return 80};
  if (n=='6') {return 100};
  if (n=='7') {return 120};
  if (n=='8') {return 140};
  if (n=='9') {return 160};
  if (n=='10') {return 180};
  if (n=='11') {return 200};
  return 330}

function xn (n)
 {if (n=='1') {return 0};
  if (n=='2') {return 30};
  if (n=='3') {return 60};
  if (n=='4') {return 90};
  if (n=='5') {return 120};
  if (n=='6') {return 150};
  if (n=='7') {return 180};
  if (n=='8') {return 210};
  if (n=='9') {return 240};
  if (n=='10') {return 270};
  if (n=='11') {return 300};
  return 330}

//------------------------------------------------------------------------------
// Drawing subroutines
//------------------------------------------------------------------------------

function drawreddish (x,y,w)
 {var ctx = w.getContext('2d');
  ctx.beginPath();
  ctx.lineWidth=1;
  ctx.moveTo(x+10,y+ 0);
  ctx.lineTo(x+30,y+ 0);
  ctx.lineTo(x+40,y+20);
  ctx.lineTo(x+30,y+40);
  ctx.lineTo(x+10,y+40);
  ctx.lineTo( x+0,y+20);
  ctx.closePath();
  ctx.fillStyle = "#fff0f0";
  ctx.fill();
  ctx.stroke()}

function drawgrey (x,y,w)
 {var ctx = w.getContext('2d');
  ctx.beginPath();
  ctx.lineWidth=1;
  ctx.moveTo(x+10,y+ 0);
  ctx.lineTo(x+30,y+ 0);
  ctx.lineTo(x+40,y+20);
  ctx.lineTo(x+30,y+40);
  ctx.lineTo(x+10,y+40);
  ctx.lineTo( x+0,y+20);
  ctx.closePath();
  ctx.fillStyle = "#dddddd";
  ctx.fill();
  ctx.stroke()}

function drawhex (x,y,canvas)
 {drawline(x+ 0,y+20,x+10,y+ 0,canvas);
  drawline(x+10,y+ 0,x+30,y+ 0,canvas);
  drawline(x+30,y+ 0,x+40,y+20,canvas);
  drawline(x+40,y+20,x+30,y+40,canvas);
  drawline(x+30,y+40,x+10,y+40,canvas);
  drawline(x+10,y+40, x+0,y+20,canvas)}

function drawred (x,y,w)
 {var ctx = w.getContext('2d');
  ctx.beginPath();
  ctx.lineWidth=2;
  ctx.arc(x+20,y+20,12,0,2*Math.PI,false);
  ctx.stroke();
  ctx.fillStyle = "#ff8888";
  ctx.fill();}

function drawblack (x,y,w)
 {var ctx = w.getContext('2d');
  ctx.beginPath();
  ctx.lineWidth=2;
  ctx.arc(x+20,y+20,12,0,2*Math.PI,false);
  ctx.stroke();
  ctx.fillStyle = "#888888";
  ctx.fill();}

function drawblank (x,y,w)
 {var ctx = w.getContext('2d');
  ctx.beginPath();
  ctx.lineWidth=2;
  ctx.arc(x+20,y+20,12,0,2*Math.PI,false);
  ctx.stroke();
  ctx.fillStyle = "#ffffff";
  ctx.fill();}

function drawline(u,v,x,y,w)
 {var ctx = w.getContext('2d');
  ctx.beginPath();
  ctx.lineWidth=1;
  ctx.moveTo(u,v);
  ctx.lineTo(x,y);
  ctx.stroke()}

function drawnode (node,x,y,canvas)
 {var mark = compfindx('X',seq('cell',node,'X'),state,library);
  if (mark=='red') {drawred(x,y,canvas); return true};
  if (mark=='black') {drawblack(x,y,canvas); return true};
  drawblank(x,y,canvas);
  return true}

function drawtext (text,x,y,w)
 {var ctx = w.getContext('2d');
  ctx.fillStyle = "#000000";
  ctx.font="italic 14px Times"
  ctx.fillText(text,x+12,y+18);
  return true}

function drawscore (text,x,y,w)
 {var ctx = w.getContext('2d');
  ctx.fillStyle = "#000000";
  ctx.font="28px Times"
  ctx.fillText(text,x+12,y+18);
  return true}

//==============================================================================
//==============================================================================
//==============================================================================
  </script>

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% hex7x7
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% metadata
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

role(red)
role(black)

base(cell(M,N,R)) :- row(M) & col(N) & role(R)
base(connected(K,M,N)) :- succ(K,L) & row(M) & col(N)
base(owner(K,R)) :- succ(K,L) & role(R)
base(step(K)) :- succ(K,L)
base(control(R)) :- role(R)

action(place(M,N)) :- row(M) & col(N)
action(transfer(M,N)) :- row(M) & col(N)
action(cleanup(J)) :- succ(J,K)
action(update(M,N)) :- row(M) & col(N)
action(kerchunk)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% init
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

init(step(1))
init(control(red))

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% legal
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

legal(place(M,N)) :- row(M) & col(N) & ~cell(M,N,red) & ~cell(M,N,black)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% operations
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

place(M,N) :: control(R) & step(K) ==> cell(M,N,R) & owner(K,R) & connected(K,M,N)
place(M,N) :: control(R) & adjacent(M,N,P,Q) & cell(P,Q,R) ==> transfer(P,Q)
place(M,N) :: kerchunk

transfer(P,Q) :: connected(J,P,Q) ==> cleanup(J)
cleanup(J) :: connected(J,M,N) ==> ~connected(J,M,N) & update(M,N)
update(M,N) :: step(K) ==> connected(K,M,N)

kerchunk :: step(M) & succ(M,N) ==> ~step(M) & step(N)
kerchunk :: control(red) ==> ~control(red) & control(black)
kerchunk :: control(black) ==> ~control(black) & control(red)

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% goal
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

goal(red,100) :- redpath
goal(red,0) :- ~redpath
goal(black,100) :- blackpath
goal(black,0) :- ~blackpath

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% terminal
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

terminal :- redpath
terminal :- blackpath

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%%% Views
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

adjacent(J,K,J,N) :- nextcol(K,N) & row(J)
adjacent(J,K,J,N) :- nextcol(N,K) & row(J)
adjacent(J,K,M,K) :- nextrow(J,M) & col(K)
adjacent(J,K,M,K) :- nextrow(M,J) & col(K)
adjacent(J,K,M,N) :- nextrow(M,J) & nextcol(K,N)
adjacent(J,K,M,N) :- nextrow(J,M) & nextcol(N,K)

redpath :- connected(K,a,I) & connected(K,g,J) & owner(K,red)
blackpath :- connected(K,I,1) & connected(K,J,7) & owner(K,black)
